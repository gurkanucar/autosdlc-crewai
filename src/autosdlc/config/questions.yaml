project_type:
  question: Proje türü nedir?
  options: [backend, frontend, fullstack, cli, library]
stack:
  question: Hangi dil ve çatılar kullanılacak? Arka uç, ön yüz ve paket yöneticisini belirt.
  free_text: true
database:
  question: Hangi veritabanı kullanılacak?
  options: [none, sqlite, postgres]
  when: [backend, fullstack]
cache:
  question: Önbellek kullanılacak mı?
  options: [none, redis]
  when: [backend, fullstack]
observability:
  question: Docker Compose hangi gözlemlenebilirlik servislerini içersin?
  options: [none, otel, openobserve]
  when: [backend, fullstack]
ui:
  question: Arka uç projesinde web arayüzü olsun mu?
  options: [none, web]
  when: [backend]
constraints:
  question: Başka teknik veya ürün kısıtları var mı?
  free_text: true
  optional: true
