project_type:
  question: What is the project type?
  options:
  - backend
  - frontend
  - fullstack
  - cli
  - library
stack:
  question: Which languages and frameworks will be used? State the backend, frontend and package manager.
  free_text: true
database:
  question: Which database will be used?
  options:
  - none
  - sqlite
  - postgres
  when:
  - backend
  - fullstack
cache:
  question: Will a cache be used?
  options:
  - none
  - redis
  when:
  - backend
  - fullstack
observability:
  question: Which observability services should Docker Compose include?
  options:
  - none
  - otel
  - openobserve
  when:
  - backend
  - fullstack
ui:
  question: Should the backend project have a web UI?
  options:
  - none
  - web
  when:
  - backend
delivery:
  question: 'How will the project be delivered? Docker: a container image; Executables: files built for every operating
    system the toolchain allows (Windows .exe, Linux, macOS); Scripts: run.sh/run.bat launchers; None: source code only.'
  options:
  - docker
  - binary
  - script
  - none
  optional: true
  # Projects created before this decision existed were all delivered with Docker. The form preselects per project type.
  default: docker
scale:
  question: What is the project scale? In a small project documents are kept short and the review only sends the design back
    on a critical finding.
  options:
  - normal
  - small
  optional: true
  default: normal
language:
  question: In which language should the agents write the documents?
  options:
  - en
  - tr
  optional: true
  default: en
constraints:
  question: Are there any other technical or product constraints?
  free_text: true
  optional: true
