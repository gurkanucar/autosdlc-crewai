project_type:
  question: Proje türü nedir?
  options: [backend, frontend, fullstack, cli, library]
stack:
  question: Hangi dil ve framework'ler kullanılacak? Backend, frontend ve package manager'ı belirt.
  free_text: true
database:
  question: Hangi veritabanı kullanılacak?
  options: [none, sqlite, postgres]
  when: [backend, fullstack]
cache:
  question: Önbellek kullanılacak mı?
  options: [none, redis]
  when: [backend, fullstack]
observability:
  question: Docker Compose hangi observability servislerini içersin?
  options: [none, otel, openobserve]
  when: [backend, fullstack]
ui:
  question: Backend projesinde web UI olsun mu?
  options: [none, web]
  when: [backend]
scale:
  question: Proje ölçeği nedir? Küçük projede belgeler kısa tutulur, inceleme yalnızca kritik bulguda tasarımı geri gönderir.
  options: [normal, small]
  optional: true
  default: normal
constraints:
  question: Başka teknik veya ürün kısıtları var mı?
  free_text: true
  optional: true
