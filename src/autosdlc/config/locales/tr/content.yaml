# Turkish translations of the example templates and the decision questions (English source -> Turkish).
⚡ Quick demo — temperature converter (Python, library): ⚡ Hızlı demo — sıcaklık dönüştürücü (Python, library)
The smallest example to see the concept in a few minutes; two functions, one test file, short documents.: Konsepti birkaç
  dakikada görmek için en küçük örnek; iki fonksiyon, tek test dosyası, kısa belgeler.
? 'A small Python library that converts between Celsius and Fahrenheit: celsius_to_fahrenheit and fahrenheit_to_celsius functions.
  Raise a ValueError for values below absolute zero (-273.15 °C).'
: 'Celsius ve Fahrenheit arasında dönüşüm yapan küçük bir Python library''si: celsius_to_fahrenheit ve fahrenheit_to_celsius
  fonksiyonları. Mutlak sıfırın (-273.15 °C) altındaki değerler için ValueError fırlatılsın.'
Python 3.12, pytest: Python 3.12, pytest
? 'Use no external dependencies; no setup command is needed. Fewest files: one source module and a single test file under
  tests/. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Dış bağımlılık kullanma, setup komutu gerekmez. En az dosya: tek kaynak modülü ve tests/ altında tek test dosyası. Bütün
  SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Calculator (Python, CLI): Hesap makinesi (Python, CLI)
A command-line calculator for the four basic operations; run.sh/run.bat launchers, short documents.: Dört işlem yapan komut
  satırı hesap makinesi; run.sh/run.bat başlatıcıları, kısa belgeler.
? 'A command-line calculator that performs the four basic operations: addition, subtraction, multiplication and division.
  Usage: calc 6 / 3 prints 2. Division by zero prints a clear error message and exits with a non-zero code.'
: 'Dört işlem yapan komut satırı hesap makinesi: toplama, çıkarma, çarpma ve bölme. Kullanım: calc 6 / 3 çıktısı 2 olsun.
  Sıfıra bölme açık bir hata mesajı yazsın ve sıfırdan farklı bir çıkış koduyla bitsin.'
Python 3.12, argparse, pytest: Python 3.12, argparse, pytest
? 'Use no external dependencies; standard library only. Fewest files: one source module and a single test file under tests/.
  Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Dış bağımlılık kullanma; yalnızca standard library. En az dosya: tek kaynak modülü ve tests/ altında tek test dosyası.
  Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Password generator (Go, CLI): Parola üretici (Go, CLI)
Prints random passwords; ready-to-run executables for Windows (.exe), Linux and macOS.: Rastgele parola üretir; Windows (.exe),
  Linux ve macOS için hazır çalıştırılabilir dosyalar.
? A command-line password generator. "genpass" prints one random password of 16 characters. "--length 24" sets the length,
  "--no-symbols" leaves out symbols and "--count 5" prints five passwords. Every password contains at least one lowercase
  letter, one uppercase letter and one digit. A length below 8 prints a clear error message and exits with a non-zero code.
: Komut satırı parola üretici. "genpass" 16 karakterlik bir rastgele parola yazar. "--length 24" uzunluğu belirler, "--no-symbols"
  sembolleri çıkarır, "--count 5" beş parola yazar. Her parola en az bir küçük harf, bir büyük harf ve bir rakam içerir. 8'den
  kısa uzunluk açık bir hata mesajı yazar ve sıfırdan farklı bir çıkış koduyla biter.
Go 1.24, standard library, go test: Go 1.24, standard library, go test
? 'Use the Go standard library only; draw the random numbers from crypto/rand, not math/rand. Fewest files: main.go and one
  package under internal/ with the generator. Keep every SDLC document short (at most half a page each); write at most 3 FRs
  and 2 NFRs.'
: 'Yalnızca Go standard library kullan; rastgele sayıları math/rand değil crypto/rand''dan al. En az dosya: main.go ve üreticiyi
  içeren internal/ altında tek paket. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2
  NFR yaz.'
Word counter (Rust, CLI): Kelime sayacı (Rust, CLI)
A wc-like tool that counts lines, words and characters; executables for Windows (.exe) and Linux.: Satır, kelime ve karakter
  sayan wc benzeri bir araç; Windows (.exe) ve Linux için çalıştırılabilir dosyalar.
? 'A command-line tool like wc: it counts the lines, words and characters of the given files, or of standard input when no
  file is given, and prints one row per file plus a total row when there is more than one file. A missing file prints a clear
  error message and exits with a non-zero code.'
: 'wc benzeri bir komut satırı aracı: verilen dosyaların, dosya verilmezse standart girdinin satır, kelime ve karakter sayılarını
  sayar; her dosya için bir satır, birden fazla dosya varsa bir de toplam satırı yazar. Bulunamayan dosya açık bir hata mesajı
  yazar ve sıfırdan farklı bir çıkış koduyla biter.'
Rust (stable), cargo, standard library: Rust (stable), cargo, standard library
? 'Use the Rust standard library only (no external crates). Fewest files: Cargo.toml, src/main.rs and src/lib.rs with the
  counting logic. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca Rust standard library kullan (harici crate yok). En az dosya: Cargo.toml, src/main.rs ve sayma mantığını içeren
  src/lib.rs. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
JSON formatter (Node.js, CLI): JSON biçimlendirici (Node.js, CLI)
Pretty-prints and validates JSON files; run.sh/run.bat launchers, no dependencies.: JSON dosyalarını biçimlendirir ve doğrular;
  run.sh/run.bat başlatıcıları, bağımlılık yok.
? 'A command-line JSON tool: "jsonfmt file.json" prints the file pretty-printed with two-space indentation and "jsonfmt --check
  file.json" only validates it. Invalid JSON prints the error position (line and column) and exits with a non-zero code.'
: 'Komut satırı JSON aracı: "jsonfmt file.json" dosyayı iki boşluk girintiyle biçimlendirip yazar, "jsonfmt --check file.json"
  yalnızca doğrular. Geçersiz JSON hatanın konumunu (satır ve sütun) yazar ve sıfırdan farklı bir çıkış koduyla biter.'
Node.js 22, ES modules, node:test: Node.js 22, ES modules, node:test
? 'Use only Node.js built-in modules (no npm dependencies). Fewest files: package.json, src/cli.js and src/format.js. Keep
  every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca Node.js yerleşik modüllerini kullan (npm bağımlılığı yok). En az dosya: package.json, src/cli.js ve src/format.js.
  Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Calculator app (Python, desktop window): Hesap makinesi uygulaması (Python, masaüstü penceresi)
A small desktop calculator with a window and buttons; starts with a double click on run.bat.: Pencereli ve düğmeli küçük masaüstü
  hesap makinesi; run.bat'a çift tıklayarak açılır.
? 'A desktop calculator app with a window: a display, the digit buttons, plus, minus, multiply and divide buttons, a clear
  button and an equals button. Dividing by zero shows "Error" on the display instead of crashing.'
: 'Pencereli bir masaüstü hesap makinesi uygulaması: bir ekran, rakam düğmeleri, artı, eksi, çarpı ve bölü düğmeleri, bir
  temizle düğmesi ve bir eşittir düğmesi. Sıfıra bölme uygulamayı çökertmek yerine ekranda "Error" gösterir.'
Python 3.12, tkinter, pytest: Python 3.12, tkinter, pytest
? 'Use tkinter and the standard library only. Keep all calculation and input-handling logic in a module that does not import
  tkinter; the window code only draws the buttons and calls that module, and creates the window inside a function (never at
  import time), because the tests run without a display. Fewest files: calculator.py (logic), app.py (window), run.bat, run.sh.
  Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca tkinter ve standard library kullan. Bütün hesaplama ve girdi işleme mantığını tkinter import etmeyen bir modülde
  tut; pencere kodu yalnızca düğmeleri çizer ve bu modülü çağırır, pencereyi de import anında değil bir fonksiyonun içinde
  oluşturur, çünkü testler ekransız çalışır. En az dosya: calculator.py (mantık), app.py (pencere), run.bat, run.sh. Bütün
  SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Calculator app (Go, one .exe): Hesap makinesi uygulaması (Go, tek .exe)
A calculator in a single file you double-click; opens in its own browser tab. Windows .exe, Linux and macOS builds.: Çift
  tıklayınca açılan tek dosyalık hesap makinesi; kendi tarayıcı sekmesinde açılır. Windows .exe, Linux ve macOS sürümleri.
? 'A calculator app in a single file: double-click it and a calculator opens, with a display, the digit buttons, plus, minus,
  multiply and divide buttons, a clear button and an equals button. Dividing by zero shows "Error" instead of crashing.'
: 'Tek dosyalık bir hesap makinesi uygulaması: çift tıklayınca bir hesap makinesi açılır; ekran, rakam düğmeleri, artı, eksi,
  çarpı ve bölü düğmeleri, bir temizle düğmesi ve bir eşittir düğmesi vardır. Sıfıra bölme çökmek yerine "Error" gösterir.'
Go 1.24, standard library; the interface is a small web page built into the program: Go 1.24, standard library; arayüz programın
  içine gömülü küçük bir web sayfası
? Use the Go standard library only. The HTML/CSS/JS is embedded in the program (embed package), so no other file is needed
  next to it. The program starts a tiny local web server that only this computer can reach and opens the page in the default
  browser; if that fails it prints the address. Put the calculation and the HTTP handler in an importable package under internal/;
  main.go only starts the server. Test the handler with net/http/httptest. Keep every SDLC document short (at most half a
  page each); write at most 3 FRs and 2 NFRs.
: Yalnızca Go standard library kullan. HTML/CSS/JS programın içine gömülü olsun (embed paketi), yanında başka dosya gerekmesin.
  Program yalnızca bu bilgisayardan erişilebilen küçük bir yerel web sunucusu başlatır ve sayfayı varsayılan tarayıcıda açar;
  açılamazsa adresi yazdırır. Hesaplamayı ve HTTP handler'ı internal/ altında içe aktarılabilir bir pakette tut; main.go yalnızca
  sunucuyu başlatır. Handler'ı net/http/httptest ile test et. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa);
  en fazla 3 FR ve 2 NFR yaz.
To-do list (Node.js, web app): Yapılacaklar listesi (Node.js, web uygulaması)
'A simple to-do list web page: add tasks, tick them off and delete them; runs in Docker.': 'Basit bir yapılacaklar web sayfası:
  görev ekle, işaretle, sil; Docker''da çalışır.'
? A simple to-do list web app. You can add a task, mark it as done or not done, and delete it. The list is saved, so it is
  still there after a restart.
: Basit bir yapılacaklar listesi web uygulaması. Görev ekleyebilir, görevi yapıldı ya da yapılmadı olarak işaretleyebilir
  ve silebilirsin. Liste kaydedilir, yeniden başlatınca da yerinde durur.
Node.js (Express), pnpm, plain HTML/CSS/JS interface: Node.js (Express), pnpm, sade HTML/CSS/JS arayüz
? Do not use a framework in the frontend, write plain HTML/CSS/JS. Prefer a SQLite solution that needs no native compilation.
  Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.
: Frontend'de framework kullanma, düz HTML/CSS/JS yaz. Native derleme gerektirmeyen bir SQLite çözümü tercih et. Bütün SDLC
  belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.
Task API (Python, web API): Görev API'si (Python, web API)
A small REST API to create, list, update and delete tasks; runs in Docker.: Görev oluşturma, listeleme, güncelleme ve silme
  için küçük bir REST API; Docker'da çalışır.
? A small task tracking API. A task has a title and a status (todo or done). The API can create a task, list the tasks (optionally
  only those with a given status), update a task and delete a task.
: Küçük bir görev takip API'si. Görevin bir başlığı ve bir durumu (yapılacak ya da bitti) vardır. API görev oluşturur, görevleri
  listeler (istenirse yalnızca belirli durumdakileri), görevi günceller ve görevi siler.
Python 3.12, FastAPI, pytest: Python 3.12, FastAPI, pytest
? Include input validation and meaningful error codes (400, 404). Keep every SDLC document short (at most half a page each);
  write at most 3 FRs and 2 NFRs.
: Girdi doğrulaması ve anlamlı hata kodları (400, 404) olsun. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa);
  en fazla 3 FR ve 2 NFR yaz.
Folder backup (sh + bat scripts): Klasör yedekleme (sh + bat script'leri)
Helper scripts that copy a folder into a timestamped backup; backup.sh for Linux/macOS and backup.bat for Windows.: Bir klasörü
  zaman damgalı yedeğe kopyalayan yardımcı script'ler; Linux/macOS için backup.sh, Windows için backup.bat.
? 'Helper scripts that back up a folder: "backup <source> <backup-folder>" copies the source folder into <backup-folder>/<source-name>-YYYYMMDD-HHMMSS
  and prints where the backup went. A missing source folder prints a clear error message and exits with a non-zero code. The
  same behaviour for Linux/macOS (backup.sh) and for Windows (backup.bat).'
: 'Bir klasörü yedekleyen yardımcı script''ler: "backup <kaynak> <yedek-klasörü>" kaynak klasörü <yedek-klasörü>/<kaynak-adı>-YYYYAAGG-SSDDSS
  klasörüne kopyalar ve yedeğin nereye gittiğini yazar. Bulunamayan kaynak klasör açık bir hata mesajı yazar ve sıfırdan farklı
  bir çıkış koduyla biter. Aynı davranış Linux/macOS (backup.sh) ve Windows (backup.bat) için sağlanır.'
POSIX sh and Windows batch (.bat), no dependencies: POSIX sh and Windows batch (.bat), no dependencies
? 'Only the standard tools of each system (cp, date / xcopy). The tests run in a Linux container: write a shell test script
  under tests/ that exercises backup.sh with temporary folders and run it with [sh, tests/test_backup.sh] as unit_test; backup.bat
  cannot run there, so describe in the README how to check it by hand. Keep every SDLC document short (at most half a page
  each); write at most 3 FRs and 2 NFRs.'
: 'Her sistemin yalnızca standart araçlarını kullan (cp, date / xcopy). Testler Linux container''ında çalışır: tests/ altında
  backup.sh''yi geçici klasörlerle çalıştıran bir shell test script''i yaz ve unit_test olarak [sh, tests/test_backup.sh]
  ile çalıştır; backup.bat orada çalışamaz, bu yüzden elle nasıl kontrol edileceğini README''de anlat. Bütün SDLC belgeleri
  kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Folder organizer (sh + bat scripts): Klasör düzenleyici (sh + bat script'leri)
? Helper scripts that sort the files of a folder into subfolders by type; organize.sh for Linux/macOS and organize.bat for
  Windows.
: Bir klasördeki dosyaları türüne göre alt klasörlere ayıran yardımcı script'ler; Linux/macOS için organize.sh, Windows için
  organize.bat.
? 'Helper scripts that tidy a folder: "organize <folder> [--dry-run]" moves every file into a subfolder named after its type
  (images, documents or other), chosen from the file extension; --dry-run only prints what would be moved. A file is skipped,
  never overwritten, when the target already has a file with that name. A missing folder prints a clear error message and
  exits with a non-zero code. The same behaviour for Linux/macOS (organize.sh) and for Windows (organize.bat).'
: 'Bir klasörü toparlayan yardımcı script''ler: "organize <klasör> [--dry-run]" her dosyayı uzantısına göre seçilen, türünün
  adını taşıyan bir alt klasöre (images, documents ya da other) taşır; --dry-run yalnızca nelerin taşınacağını yazar. Hedefte
  aynı adlı bir dosya varsa dosya atlanır, üzerine hiç yazılmaz. Bulunamayan klasör açık bir hata mesajı yazar ve sıfırdan
  farklı bir çıkış koduyla biter. Aynı davranış Linux/macOS (organize.sh) ve Windows (organize.bat) için sağlanır.'
? 'Only the standard tools of each system. The tests run in a Linux container: write a shell test script under tests/ that
  exercises organize.sh with temporary folders and run it with [sh, tests/test_organize.sh] as unit_test; organize.bat cannot
  run there, so describe in the README how to check it by hand. Keep every SDLC document short (at most half a page each);
  write at most 3 FRs and 2 NFRs.'
: 'Her sistemin yalnızca standart araçlarını kullan. Testler Linux container''ında çalışır: tests/ altında organize.sh''yi
  geçici klasörlerle çalıştıran bir shell test script''i yaz ve unit_test olarak [sh, tests/test_organize.sh] ile çalıştır;
  organize.bat orada çalışamaz, bu yüzden elle nasıl kontrol edileceğini README''de anlat. Bütün SDLC belgeleri kısa olsun
  (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
What is the project type?: Proje türü nedir?
Which languages and frameworks will be used? State the backend, frontend and package manager.: Hangi dil ve framework'ler
  kullanılacak? Backend, frontend ve package manager'ı belirt.
Which database will be used?: Hangi veritabanı kullanılacak?
Will a cache be used?: Önbellek kullanılacak mı?
Which observability services should Docker Compose include?: Docker Compose hangi observability servislerini içersin?
Should the backend project have a web UI?: Backend projesinde web UI olsun mu?
? 'How will the project be delivered? Docker: a container image; Executables: files built for every operating system the toolchain
  allows (Windows .exe, Linux, macOS); Scripts: run.sh/run.bat launchers; None: source code only.'
: 'Proje nasıl teslim edilecek? Docker: container imajı; Çalıştırılabilir dosya: araç zincirinin izin verdiği her işletim
  sistemi için derlenmiş dosyalar (Windows .exe, Linux, macOS); Script: run.sh/run.bat başlatıcıları; Yok: yalnızca kaynak
  kod.'
? What is the project scale? In a small project documents are kept short and the review only sends the design back on a critical
  finding.
: Proje ölçeği nedir? Küçük projede belgeler kısa tutulur ve inceleme yalnızca kritik bulguda tasarımı geri gönderir.
In which language should the agents write the documents?: Ajanlar belgeleri hangi dilde yazsın?
Are there any other technical or product constraints?: Başka teknik veya ürün kısıtları var mı?
