? Node.js 22, Express 5, TypeORM + PostgreSQL (plain JavaScript ES modules), zod, pnpm; React 18 + Vite + axios + Ant Design
  5 frontend
: Node.js 22, Express 5, TypeORM + PostgreSQL (düz JavaScript ES modülleri), zod, pnpm; React 18 + Vite + axios + Ant Design
  5 frontend
? 'Two folders, each organized by feature. server/: Express API under /api in plain JavaScript (no TypeScript build); server/src/features/<auth|users|events|registrations>/
  each hold that feature''s TypeORM EntitySchema (no decorators), routes, service and zod schemas; the TypeORM DataSource
  (DATABASE_URL, synchronize: true creates the tables at startup), config, error class and the auth and validation middleware
  live in server/src/common/. Validate every request body, params and query with zod; an invalid request answers 400 {error:
  {code: ''VALIDATION_ERROR'', message, details: [{field, message}]}}, and every error has the {error: {code, message}} shape.
  web/: React 18 + Vite + axios + Ant Design 5 (antd, @ant-design/icons and dayjs as direct dependencies), with web/src/features/<auth|events|admin>/
  and the api client, auth context and layout in web/src/shared/; import ''antd/dist/reset.css'' once, wrap the app in ConfigProvider
  (Turkish locale) and antd''s App, and build every screen from antd components (Layout, Menu, Form with a name, Card, Table,
  Upload, DatePicker), never unstyled HTML. The axios instance has baseURL ''/api'', so calls use ''/events'', never ''/api/events''.
  After a logout the next login opens the events page. Use react ^18, antd ^5 and express ^5, never "latest" for them. pnpm-workspace.yaml
  lists server and web; the root package.json has only playwright and pg as devDependencies. All tests use node:test: tests/api/*.test.js
  and tests/ui/*.test.js (chromium from ''playwright''). project.yaml, exactly: setup: [sh, -c, "corepack pnpm@10.26.0 install
  --no-frozen-lockfile && corepack pnpm@10.26.0 --dir web run build"], api_test: [node, --test, tests/api/*.test.js], ui_test:
  [sh, -c, "corepack pnpm@10.26.0 exec playwright install chromium && node --test tests/ui/*.test.js"], start: [node, server/src/index.js];
  the server also serves web/dist and /uploads on the same port. Hash passwords with bcryptjs. Login returns a JWT signed
  with JWT_SECRET (no default: stop at startup when it is missing) that the client sends as Authorization: Bearer <token>
  (axios interceptor); check the role on the server for every protected route (401 not logged in, 403 role not allowed). Register
  inside one transaction with a pessimistic write lock on the event row, so two people cannot take the last place; a full
  event, a past event or a second registration answers 409. Creating an event with a past date is allowed (tests need it).
  Upload the cover with multer: JPEG, PNG or WebP (checked by its first bytes) up to 5 MB, saved in UPLOADS_DIR under a generated
  name; other files answer 400, and the uploaded file is deleted whenever the request fails. UI tests create users and events
  through the API and use the browser only to log in and to register or cancel. A test file that opens a database connection
  closes it in after(), or the test process never exits. Keep every SDLC document short (at most half a page each); at most
  4 FRs and 2 NFRs.'
: 'İki klasör, ikisi de feature''a göre düzenlenir. server/: düz JavaScript ile /api altında Express API (TypeScript build
  yok); server/src/features/<auth|users|events|registrations>/ klasörlerinin her biri o feature''ın TypeORM EntitySchema''sını
  (decorator yok), route''larını, service''ini ve zod şemalarını tutar; TypeORM DataSource (DATABASE_URL, synchronize: true
  tabloları açılışta oluşturur), config, hata sınıfı ve auth ile doğrulama middleware''leri server/src/common/ içindedir.
  Her isteğin body, params ve query''sini zod ile doğrula; geçersiz istek 400 {error: {code: ''VALIDATION_ERROR'', message,
  details: [{field, message}]}} döner ve her hata {error: {code, message}} biçimindedir. web/: React 18 + Vite + axios + Ant
  Design 5 (antd, @ant-design/icons ve dayjs doğrudan bağımlılık), web/src/features/<auth|events|admin>/ ve api istemcisi,
  auth context ile layout web/src/shared/ içinde; ''antd/dist/reset.css'' dosyasını bir kez import et, uygulamayı ConfigProvider
  (Türkçe locale) ve antd''nin App bileşeniyle sar ve her ekranı antd bileşenleriyle kur (Layout, Menu, name verilmiş Form,
  Card, Table, Upload, DatePicker), asla stilsiz HTML kullanma. axios instance''ının baseURL''i ''/api'', bu yüzden çağrılar
  ''/events'' kullanır, asla ''/api/events'' değil. Çıkıştan sonraki giriş etkinlikler sayfasını açar. react ^18, antd ^5
  ve express ^5 kullan, bunlar için asla "latest" yazma. pnpm-workspace.yaml server ve web''i listeler; kök package.json''ın
  devDependency''leri yalnızca playwright ve pg. Bütün testler node:test kullanır: tests/api/*.test.js ve tests/ui/*.test.js
  (''playwright'' chromium''u). project.yaml, aynen: setup: [sh, -c, "corepack pnpm@10.26.0 install --no-frozen-lockfile &&
  corepack pnpm@10.26.0 --dir web run build"], api_test: [node, --test, tests/api/*.test.js], ui_test: [sh, -c, "corepack
  pnpm@10.26.0 exec playwright install chromium && node --test tests/ui/*.test.js"], start: [node, server/src/index.js]; sunucu
  web/dist ve /uploads''u da aynı portta sunar. Parolaları bcryptjs ile hash''le. Giriş, JWT_SECRET ile imzalanmış bir JWT
  döndürür (varsayılan değer yok: eksikse açılışta dur), istemci bunu Authorization: Bearer <token> olarak gönderir (axios
  interceptor); korumalı her route''ta rolü sunucuda kontrol et (giriş yoksa 401, rol izin vermiyorsa 403). Kaydı, etkinlik
  satırında pessimistic write lock ile tek bir transaction içinde yap ki iki kişi son yeri alamasın; dolu etkinlik, geçmiş
  etkinlik ya da ikinci kayıt 409 döner. Geçmiş tarihli etkinlik oluşturmaya izin verilir (testler kullanır). Kapak resmini
  multer ile yükle: ilk byte''larıyla kontrol edilen, en fazla 5 MB JPEG, PNG ya da WebP, UPLOADS_DIR içine üretilmiş bir
  adla kaydedilir; diğer dosyalar 400 döner ve istek başarısız olduğunda yüklenen dosya silinir. UI testleri kullanıcıları
  ve etkinlikleri API ile oluşturur, tarayıcıyı yalnızca giriş yapmak ve kayıt olup iptal etmek için kullanır. Veritabanı
  bağlantısı açan bir test dosyası onu after() içinde kapatır, yoksa test süreci hiç bitmez. SDLC belgeleri kısa olsun (her
  biri en fazla yarım sayfa); en fazla 4 FR ve 2 NFR.'
Task API (Python, web API): Görev API'si (Python, web API)
A small REST API to create, list, update and delete tasks; runs in Docker.: Görev oluşturma, listeleme, güncelleme ve silme
  için küçük bir REST API; Docker'da çalışır.
? A small task tracking API. A task has a title and a status (todo or done). The API can create a task, list the tasks (optionally
  only those with a given status), update a task and delete a task.
: Küçük bir görev takip API'si. Görevin bir başlığı ve bir durumu (yapılacak ya da bitti) vardır. API görev oluşturur, görevleri
  listeler (istenirse yalnızca belirli durumdakileri), görevi günceller ve görevi siler.
Python 3.12, FastAPI, pytest: Python 3.12, FastAPI, pytest
? Include input validation and meaningful error codes (400, 404). Keep every SDLC document short (at most half a page each);
  write at most 3 FRs and 2 NFRs.
: Girdi doğrulaması ve anlamlı hata kodları (400, 404) olsun. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa);
  en fazla 3 FR ve 2 NFR yaz.
Acrostic poem writer (Python, console, AI): Akrostiş şiir yazıcı (Python, konsol, yapay zekâ)
? Type a word and an AI model writes an acrostic poem whose lines start with its letters; poems are saved and can be listed. Asks
  for the OpenCode Go API key once. Starts with a double click on run.bat (Python must be installed).
: Bir kelime yaz, yapay zekâ modeli dizeleri o kelimenin harfleriyle başlayan bir akrostiş şiir yazsın; şiirler kaydedilir ve listelenebilir.
  OpenCode Go API anahtarını bir kez sorar. run.bat'a çift tıklayarak açılır (Python kurulu olmalı).
? 'A console app that writes acrostic poems with an AI model. On the first start it asks for the OpenCode Go API key once (the typing
  is hidden) and remembers it, so it is not asked again. Then it keeps running with a "> " prompt: typing a word, optionally followed
  by a theme ("SPRING: hope"), writes a poem whose lines start with the letters of the word in order, shows it and saves it. "list"
  shows the saved poems with their numbers, words and dates, "show 3" prints poem number 3 again, "delete 3" removes it, "key" asks
  for a new API key, "help" shows the commands and "quit" closes it. The poems are still there after a restart. A network or key error
  prints a short message and the app keeps running.'
: 'Yapay zekâ modeliyle akrostiş şiir yazan bir konsol uygulaması. İlk açılışta OpenCode Go API anahtarını bir kez sorar (yazılan
  görünmez) ve hatırlar, bir daha sormaz. Sonra "> " istemiyle çalışmaya devam eder: bir kelime, istenirse ardından bir tema ("BAHAR:
  umut") yazınca dizeleri kelimenin harfleriyle sırayla başlayan bir şiir yazar, gösterir ve kaydeder. "list" kayıtlı şiirleri numarası,
  kelimesi ve tarihiyle gösterir, "show 3" 3 numaralı şiiri yeniden yazar, "delete 3" onu siler, "key" yeni bir API anahtarı sorar,
  "help" komutları gösterir, "quit" kapatır. Şiirler yeniden başlatınca da yerinde durur. Ağ ya da anahtar hatası kısa bir mesaj yazar
  ve uygulama çalışmaya devam eder.'
Python 3.12, standard library (urllib.request, getpass, json), pytest; OpenCode Go model glm-5.3-flash: Python 3.12, standard library
  (urllib.request, getpass, json), pytest; OpenCode Go modeli glm-5.3-flash
? 'Standard library only, so no setup command. The model is called with POST https://opencode.ai/inference/go/openai/v1/chat/completions
  (OpenAI-compatible body {model, messages}, header Authorization: Bearer <key>, answer in choices[0].message.content); the model
  is glm-5.3-flash unless the OPENCODE_MODEL environment variable names another, and a request times out after 120 seconds. The key
  comes from the OPENCODE_API_KEY environment variable when it is set, otherwise from config.json, otherwise it is asked with getpass
  and saved to config.json; never print the key. The poem is written in the language of the word. Check that the first letters of
  the poem''s lines spell the word (ignoring case, empty lines and punctuation, Turkish letters included); if they do not, ask the
  model again, at most two more times, and then say it failed without saving. Save the poems to poems.jsonl (one poem per line with
  id, word, theme, text, model and created_at) and config.json in the folder given by the POET_DATA_DIR environment variable, or next
  to the program when it is not set; .gitignore lists both files. Put the acrostic check, the prompt and the jsonl store in poet.py
  and the command loop in a function run(input_stream, output_stream, store, complete, ask_key), where complete(messages) returns
  the model''s text; the HTTP call lives in client.py. main.py only wires them together and ends quietly on Ctrl+C or end of input.
  The tests never call the network or need a key: they pass a fake complete and temporary folders. Fewest files: poet.py, client.py,
  main.py, run.bat, run.sh, .gitignore and one test file under tests/. Keep every SDLC document short (at most half a page each);
  write at most 3 FRs and 2 NFRs.'
: 'Yalnızca standard library kullan, bu yüzden setup komutu yok. Model POST https://opencode.ai/inference/go/openai/v1/chat/completions
  ile çağrılır (OpenAI uyumlu gövde {model, messages}, Authorization: Bearer <anahtar> başlığı, cevap choices[0].message.content içinde);
  OPENCODE_MODEL ortam değişkeni başka bir model belirtmedikçe model glm-5.3-flash olur ve bir istek 120 saniyede zaman aşımına uğrar.
  Anahtar, ayarlıysa OPENCODE_API_KEY ortam değişkeninden, değilse config.json''dan alınır; o da yoksa getpass ile sorulur ve config.json''a
  kaydedilir; anahtar asla ekrana yazılmaz. Şiir kelimenin dilinde yazılır. Şiirdeki dizelerin ilk harflerinin kelimeyi oluşturduğunu
  kontrol et (büyük/küçük harf, boş satırlar ve noktalama yok sayılır, Türkçe harfler dahil); oluşturmuyorsa modele en fazla iki kez
  daha sor, sonra kaydetmeden başarısız olduğunu söyle. Şiirleri poems.jsonl''a (her satırda id, word, theme, text, model ve created_at
  ile bir şiir) ve config.json''u POET_DATA_DIR ortam değişkeninin verdiği klasöre, o yoksa programın yanına kaydet; .gitignore ikisini
  de listeler. Akrostiş kontrolünü, istemi ve jsonl deposunu poet.py içine, komut döngüsünü de run(input_stream, output_stream, store,
  complete, ask_key) fonksiyonuna koy; complete(messages) modelin metnini döndürür; HTTP çağrısı client.py içindedir. main.py yalnızca
  bunları birbirine bağlar ve Ctrl+C''de ya da girdi bitince sessizce kapanır. Testler hiç ağa çıkmaz ve anahtar istemez: sahte bir
  complete ve geçici klasörler kullanır. En az dosya: poet.py, client.py, main.py, run.bat, run.sh, .gitignore ve tests/ altında tek
  test dosyası. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
