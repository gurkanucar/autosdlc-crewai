? 'An event registration web app. People can sign up and log in. Organizers create events with a title, a description, a date,
  a capacity and a cover image they upload, and see who registered for their own events. Users see the upcoming events with
  their images and the number of free places, register for an event and cancel their registration. A user cannot register
  twice for the same event, and registration closes when the event is full or has already taken place. There are three roles:
  user, organizer and admin; an admin changes other users'' roles. The first user who signs up becomes the admin.'
: 'Bir etkinlik kayıt web uygulaması. Kişiler kayıt olup giriş yapabilir. Düzenleyiciler başlık, açıklama, tarih, kontenjan
  ve yükledikleri bir kapak resmiyle etkinlik oluşturur ve kendi etkinliklerine kimlerin kayıt olduğunu görür. Kullanıcılar
  yaklaşan etkinlikleri resimleri ve boş yer sayısıyla görür, bir etkinliğe kayıt olur ve kaydını iptal eder. Bir kullanıcı
  aynı etkinliğe iki kez kayıt olamaz; etkinlik dolduğunda ya da tarihi geçtiğinde kayıt kapanır. Üç rol var: user, organizer
  ve admin; admin diğer kullanıcıların rolünü değiştirir. İlk kayıt olan kullanıcı admin olur.'
? Node.js 22, Express 5, TypeORM + PostgreSQL (plain JavaScript ES modules), zod, pnpm; React 18 + Vite + axios + Ant Design
  5 frontend
: Node.js 22, Express 5, TypeORM + PostgreSQL (düz JavaScript ES modülleri), zod, pnpm; React 18 + Vite + axios + Ant Design
  5 frontend
? 'Two folders, each organized by feature. server/: Express API under /api in plain JavaScript (no TypeScript build); server/src/features/<auth|users|events|registrations>/
  each hold that feature''s TypeORM EntitySchema (no decorators), routes, service and zod schemas; the TypeORM DataSource
  (DATABASE_URL, synchronize: true creates the tables at startup), config, error class and the auth and validation middleware
  live in server/src/common/. Validate every request body, params and query with zod; an invalid request answers 400 {error:
  {code: ''VALIDATION_ERROR'', message, details: [{field, message}]}}, and every error has the {error: {code, message}} shape.
  web/: React 18 + Vite + axios + Ant Design 5 (antd, @ant-design/icons and dayjs as direct dependencies), with web/src/features/<auth|events|admin>/
  and the api client, auth context and layout in web/src/shared/; import ''antd/dist/reset.css'' once, wrap the app in ConfigProvider
  (Turkish locale) and antd''s App, and build every screen from antd components (Layout, Menu, Form with a name, Card, Table,
  Upload, DatePicker), never unstyled HTML. The axios instance has baseURL ''/api'', so calls use ''/events'', never ''/api/events''.
  After a logout the next login opens the events page. Use react ^18, antd ^5 and express ^5, never "latest" for them. pnpm-workspace.yaml
  lists server and web; the root package.json has only playwright and pg as devDependencies. All tests use node:test: tests/api/*.test.js
  and tests/ui/*.test.js (chromium from ''playwright''). project.yaml, exactly: setup: [sh, -c, "corepack pnpm@10.26.0 install
  --no-frozen-lockfile && corepack pnpm@10.26.0 --dir web run build"], api_test: [node, --test, tests/api/*.test.js], ui_test:
  [sh, -c, "corepack pnpm@10.26.0 exec playwright install chromium && node --test tests/ui/*.test.js"], start: [node, server/src/index.js];
  the server also serves web/dist and /uploads on the same port. Hash passwords with bcryptjs. Login returns a JWT signed
  with JWT_SECRET (no default: stop at startup when it is missing) that the client sends as Authorization: Bearer <token>
  (axios interceptor); check the role on the server for every protected route (401 not logged in, 403 role not allowed). Register
  inside one transaction with a pessimistic write lock on the event row, so two people cannot take the last place; a full
  event, a past event or a second registration answers 409. Creating an event with a past date is allowed (tests need it).
  Upload the cover with multer: JPEG, PNG or WebP (checked by its first bytes) up to 5 MB, saved in UPLOADS_DIR under a generated
  name; other files answer 400, and the uploaded file is deleted whenever the request fails. UI tests create users and events
  through the API and use the browser only to log in and to register or cancel. A test file that opens a database connection
  closes it in after(), or the test process never exits. Keep every SDLC document short (at most half a page each); at most
  4 FRs and 2 NFRs.'
: 'İki klasör, ikisi de feature''a göre düzenlenir. server/: düz JavaScript ile /api altında Express API (TypeScript build
  yok); server/src/features/<auth|users|events|registrations>/ klasörlerinin her biri o feature''ın TypeORM EntitySchema''sını
  (decorator yok), route''larını, service''ini ve zod şemalarını tutar; TypeORM DataSource (DATABASE_URL, synchronize: true
  tabloları açılışta oluşturur), config, hata sınıfı ve auth ile doğrulama middleware''leri server/src/common/ içindedir.
  Her isteğin body, params ve query''sini zod ile doğrula; geçersiz istek 400 {error: {code: ''VALIDATION_ERROR'', message,
  details: [{field, message}]}} döner ve her hata {error: {code, message}} biçimindedir. web/: React 18 + Vite + axios + Ant
  Design 5 (antd, @ant-design/icons ve dayjs doğrudan bağımlılık), web/src/features/<auth|events|admin>/ ve api istemcisi,
  auth context ile layout web/src/shared/ içinde; ''antd/dist/reset.css'' dosyasını bir kez import et, uygulamayı ConfigProvider
  (Türkçe locale) ve antd''nin App bileşeniyle sar ve her ekranı antd bileşenleriyle kur (Layout, Menu, name verilmiş Form,
  Card, Table, Upload, DatePicker), asla stilsiz HTML kullanma. axios instance''ının baseURL''i ''/api'', bu yüzden çağrılar
  ''/events'' kullanır, asla ''/api/events'' değil. Çıkıştan sonraki giriş etkinlikler sayfasını açar. react ^18, antd ^5
  ve express ^5 kullan, bunlar için asla "latest" yazma. pnpm-workspace.yaml server ve web''i listeler; kök package.json''ın
  devDependency''leri yalnızca playwright ve pg. Bütün testler node:test kullanır: tests/api/*.test.js ve tests/ui/*.test.js
  (''playwright'' chromium''u). project.yaml, aynen: setup: [sh, -c, "corepack pnpm@10.26.0 install --no-frozen-lockfile &&
  corepack pnpm@10.26.0 --dir web run build"], api_test: [node, --test, tests/api/*.test.js], ui_test: [sh, -c, "corepack
  pnpm@10.26.0 exec playwright install chromium && node --test tests/ui/*.test.js"], start: [node, server/src/index.js]; sunucu
  web/dist ve /uploads''u da aynı portta sunar. Parolaları bcryptjs ile hash''le. Giriş, JWT_SECRET ile imzalanmış bir JWT
  döndürür (varsayılan değer yok: eksikse açılışta dur), istemci bunu Authorization: Bearer <token> olarak gönderir (axios
  interceptor); korumalı her route''ta rolü sunucuda kontrol et (giriş yoksa 401, rol izin vermiyorsa 403). Kaydı, etkinlik
  satırında pessimistic write lock ile tek bir transaction içinde yap ki iki kişi son yeri alamasın; dolu etkinlik, geçmiş
  etkinlik ya da ikinci kayıt 409 döner. Geçmiş tarihli etkinlik oluşturmaya izin verilir (testler kullanır). Kapak resmini
  multer ile yükle: ilk byte''larıyla kontrol edilen, en fazla 5 MB JPEG, PNG ya da WebP, UPLOADS_DIR içine üretilmiş bir
  adla kaydedilir; diğer dosyalar 400 döner ve istek başarısız olduğunda yüklenen dosya silinir. UI testleri kullanıcıları
  ve etkinlikleri API ile oluşturur, tarayıcıyı yalnızca giriş yapmak ve kayıt olup iptal etmek için kullanır. Veritabanı
  bağlantısı açan bir test dosyası onu after() içinde kapatır, yoksa test süreci hiç bitmez. SDLC belgeleri kısa olsun (her
  biri en fazla yarım sayfa); en fazla 4 FR ve 2 NFR.'
