Word counter (Rust, CLI): Kelime sayacı (Rust, CLI)
A wc-like tool that counts lines, words and characters; executables for Windows (.exe) and Linux.: Satır, kelime ve karakter
  sayan wc benzeri bir araç; Windows (.exe) ve Linux için çalıştırılabilir dosyalar.
? 'A command-line tool like wc: it counts the lines, words and characters of the given files, or of standard input when no
  file is given, and prints one row per file plus a total row when there is more than one file. A missing file prints a clear
  error message and exits with a non-zero code.'
: 'wc benzeri bir komut satırı aracı: verilen dosyaların, dosya verilmezse standart girdinin satır, kelime ve karakter sayılarını
  sayar; her dosya için bir satır, birden fazla dosya varsa bir de toplam satırı yazar. Bulunamayan dosya açık bir hata mesajı
  yazar ve sıfırdan farklı bir çıkış koduyla biter.'
Rust (stable), cargo, standard library: Rust (stable), cargo, standard library
? 'Use the Rust standard library only (no external crates). Fewest files: Cargo.toml, src/main.rs and src/lib.rs with the
  counting logic. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca Rust standard library kullan (harici crate yok). En az dosya: Cargo.toml, src/main.rs ve sayma mantığını içeren
  src/lib.rs. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
JSON formatter (Node.js, CLI): JSON biçimlendirici (Node.js, CLI)
Pretty-prints and validates JSON files; run.sh/run.bat launchers, no dependencies.: JSON dosyalarını biçimlendirir ve doğrular;
  run.sh/run.bat başlatıcıları, bağımlılık yok.
? 'A command-line JSON tool: "jsonfmt file.json" prints the file pretty-printed with two-space indentation and "jsonfmt --check
  file.json" only validates it. Invalid JSON prints the error position (line and column) and exits with a non-zero code.'
: 'Komut satırı JSON aracı: "jsonfmt file.json" dosyayı iki boşluk girintiyle biçimlendirip yazar, "jsonfmt --check file.json"
  yalnızca doğrular. Geçersiz JSON hatanın konumunu (satır ve sütun) yazar ve sıfırdan farklı bir çıkış koduyla biter.'
Node.js 22, ES modules, node:test: Node.js 22, ES modules, node:test
? 'Use only Node.js built-in modules (no npm dependencies). Fewest files: package.json, src/cli.js and src/format.js. Keep
  every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca Node.js yerleşik modüllerini kullan (npm bağımlılığı yok). En az dosya: package.json, src/cli.js ve src/format.js.
  Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Calculator desktop app (Python, window): Hesap makinesi masaüstü uygulaması (Python, pencere)
A small desktop calculator with a real window and buttons; run.bat / run.sh launchers, logic tested without a display.: Gerçek
  bir pencere ve düğmeleri olan küçük masaüstü hesap makinesi; run.bat / run.sh başlatıcıları, mantık ekransız test edilir.
? 'A desktop calculator app with a window: a display, the digit buttons, the four basic operations, a clear button and an
  equals button. Division by zero shows "Error" on the display instead of crashing. It runs on Windows with a double click
  on run.bat.'
: 'Pencereli bir masaüstü hesap makinesi uygulaması: bir ekran, rakam düğmeleri, dört işlem, temizle ve eşittir düğmesi. Sıfıra
  bölme uygulamayı çökertmek yerine ekranda "Error" gösterir. Windows''ta run.bat''a çift tıklayarak çalışır.'
Python 3.12, tkinter, pytest: Python 3.12, tkinter, pytest
? 'Use tkinter and the standard library only. Keep all calculation and input-handling logic in a module that does not import
  tkinter; the window code only draws the buttons and calls that module, and creates the window inside a function (never at
  import time), because the tests run without a display. Fewest files: calculator.py (logic), app.py (window), run.bat, run.sh.
  Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
: 'Yalnızca tkinter ve standard library kullan. Bütün hesaplama ve girdi işleme mantığını tkinter import etmeyen bir modülde
  tut; pencere kodu yalnızca düğmeleri çizer ve bu modülü çağırır, pencereyi de import anında değil bir fonksiyonun içinde
  oluşturur, çünkü testler ekransız çalışır. En az dosya: calculator.py (mantık), app.py (pencere), run.bat, run.sh. Bütün
  SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Calculator desktop app (Go, single .exe): Hesap makinesi masaüstü uygulaması (Go, tek .exe)
? A calculator that opens in its own browser window from one self-contained executable (Windows .exe, Linux, macOS); no installation.
: Tek başına çalışan bir dosyadan kendi tarayıcı penceresinde açılan hesap makinesi (Windows .exe, Linux, macOS); kurulum
  gerekmez.
? A calculator app delivered as ONE executable file. When started it serves a small calculator page (display, digit buttons,
  the four basic operations, clear and equals) on a free port of 127.0.0.1 and opens it in the default browser; if the browser
  cannot be opened it prints the address. Division by zero shows "Error" instead of crashing.
: TEK bir çalıştırılabilir dosya olarak teslim edilen hesap makinesi uygulaması. Başlatılınca 127.0.0.1'in boş bir portunda
  küçük bir hesap makinesi sayfası (ekran, rakam düğmeleri, dört işlem, temizle ve eşittir) sunar ve varsayılan tarayıcıda
  açar; tarayıcı açılamazsa adresi yazdırır. Sıfıra bölme çökmek yerine "Error" gösterir.
Go 1.24, standard library (net/http, embed), go test: Go 1.24, standard library (net/http, embed), go test
? Use the Go standard library only; embed the HTML/CSS/JS in the executable with the embed package so no other file is needed
  next to it. Put the calculation and the HTTP handler in an importable package (internal/...); main.go only starts the server
  and opens the browser. Test the handler with net/http/httptest. Keep every SDLC document short (at most half a page each);
  write at most 3 FRs and 2 NFRs.
: Yalnızca Go standard library kullan; HTML/CSS/JS'i embed paketiyle çalıştırılabilir dosyanın içine göm, yanında başka dosya
  gerekmesin. Hesaplamayı ve HTTP handler'ı içe aktarılabilir bir pakette (internal/...) tut; main.go yalnızca sunucuyu başlatır
  ve tarayıcıyı açar. Handler'ı net/http/httptest ile test et. Bütün SDLC belgeleri kısa olsun (her biri en fazla yarım sayfa);
  en fazla 3 FR ve 2 NFR yaz.
Folder backup helper (sh + bat): Klasör yedekleme yardımcısı (sh + bat)
? Helper scripts that copy a folder into a timestamped backup and keep only the newest backups; the same behaviour as backup.sh
  and backup.bat.
: Bir klasörü zaman damgalı yedeğe kopyalayan ve yalnızca en yeni yedekleri tutan yardımcı script'ler; backup.sh ve backup.bat
  aynı davranışı sunar.
? 'Helper scripts that back up a folder: "backup <source> <backup-root> [keep]" copies the source folder into <backup-root>/<source-name>-YYYYMMDD-HHMMSS
  and then deletes the oldest backups of that source so that only the newest N remain (default 5). A missing source folder
  prints a clear error and exits with a non-zero code. Provide the same behaviour for Linux/macOS (backup.sh) and Windows
  (backup.bat).'
: 'Bir klasörü yedekleyen yardımcı script''ler: "backup <kaynak> <yedek-kökü> [adet]" kaynak klasörü <yedek-kökü>/<kaynak-adı>-YYYYAAGG-SSDDSS
  klasörüne kopyalar, ardından o kaynağın en eski yedeklerini siler ve yalnızca en yeni N tanesini (varsayılan 5) bırakır.
  Bulunamayan kaynak klasör açık bir hata yazar ve sıfırdan farklı bir çıkış koduyla biter. Aynı davranışı Linux/macOS (backup.sh)
  ve Windows (backup.bat) için sağla.'
POSIX sh and Windows batch (.bat), no dependencies: POSIX sh and Windows batch (.bat), no dependencies
? 'Only standard tools of each system (cp, rm, date / xcopy, robocopy). The tests run in a Linux container: write a shell
  test script under tests/ that exercises backup.sh with temporary folders and run it with [sh, tests/test_backup.sh] as unit_test;
  backup.bat cannot run there, so describe how to check it by hand in the README. Keep every SDLC document short (at most
  half a page each); write at most 3 FRs and 2 NFRs.'
: 'Her sistemin yalnızca standart araçlarını kullan (cp, rm, date / xcopy, robocopy). Testler Linux container''ında çalışır:
  tests/ altında backup.sh''yi geçici klasörlerle çalıştıran bir shell test script''i yaz ve unit_test olarak [sh, tests/test_backup.sh]
  ile çalıştır; backup.bat orada çalışamaz, bu yüzden elle nasıl kontrol edileceğini README''de anlat. Bütün SDLC belgeleri
  kısa olsun (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Downloads organizer (sh + bat): İndirilenler düzenleyici (sh + bat)
Helper scripts that sort the files of a folder into subfolders by type, with a dry-run mode.: Bir klasördeki dosyaları türüne
  göre alt klasörlere ayıran, kuru çalıştırma (dry-run) modlu yardımcı script'ler.
? 'Helper scripts that tidy a folder: "organize <folder> [--dry-run]" moves every file into a subfolder named after its type
  (images, documents, archives, other) chosen from the file extension; --dry-run only prints what would be moved. Existing
  files are never overwritten (a counter is added to the name). A missing folder prints a clear error and exits with a non-zero
  code. Provide the same behaviour for Linux/macOS (organize.sh) and Windows (organize.bat).'
: 'Bir klasörü toparlayan yardımcı script''ler: "organize <klasör> [--dry-run]" her dosyayı uzantısına göre seçilen, türünün
  adını taşıyan bir alt klasöre (images, documents, archives, other) taşır; --dry-run yalnızca nelerin taşınacağını yazar.
  Var olan dosyaların üzerine hiç yazılmaz (ada bir sayaç eklenir). Bulunamayan klasör açık bir hata yazar ve sıfırdan farklı
  bir çıkış koduyla biter. Aynı davranışı Linux/macOS (organize.sh) ve Windows (organize.bat) için sağla.'
? 'Only standard tools of each system. The tests run in a Linux container: write a shell test script under tests/ that exercises
  organize.sh with temporary folders and run it with [sh, tests/test_organize.sh] as unit_test; organize.bat cannot run there,
  so describe how to check it by hand in the README. Keep every SDLC document short (at most half a page each); write at most
  3 FRs and 2 NFRs.'
: 'Her sistemin yalnızca standart araçlarını kullan. Testler Linux container''ında çalışır: tests/ altında organize.sh''yi
  geçici klasörlerle çalıştıran bir shell test script''i yaz ve unit_test olarak [sh, tests/test_organize.sh] ile çalıştır;
  organize.bat orada çalışamaz, bu yüzden elle nasıl kontrol edileceğini README''de anlat. Bütün SDLC belgeleri kısa olsun
  (her biri en fazla yarım sayfa); en fazla 3 FR ve 2 NFR yaz.'
Inventory tracker (Node.js, fullstack): Envanter takip uygulaması (Node.js, fullstack)
A simple web application that keeps stock records with product name, category and location.: Ürün adı, kategori ve konum bilgisiyle
  stok kaydı tutan basit bir web uygulaması.
? A simple inventory tracking application. Products are stored with product name, category and location (warehouse/shelf).
  It supports adding, editing, deleting and listing products; the list can be searched by product name and filtered by category
  and location.
: Basit bir envanter takip uygulaması. Ürünler; ürün adı, kategori ve konum (depo/raf) bilgisiyle saklanacak. Ürün ekleme,
  düzenleme, silme ve listeleme olacak; liste ürün adına göre aranabilecek, kategoriye ve konuma göre süzülebilecek.
Node.js (Express), pnpm, plain HTML/CSS/JS interface: Node.js (Express), pnpm, sade HTML/CSS/JS arayüz
? Do not use a framework in the frontend, write plain HTML/CSS/JS. The user interface texts should be in Turkish. Prefer a
  SQLite solution that needs no native compilation.
: Frontend'de framework kullanma, düz HTML/CSS/JS yaz. Kullanıcı arayüzü metinleri Türkçe olsun. Native derleme gerektirmeyen
  bir SQLite çözümü tercih et.
Task tracking API (Python, backend): Görev takip API'si (Python, backend)
A REST API with endpoints to create, list, complete and delete tasks.: Görev oluşturma, listeleme, tamamlama ve silme endpoint'leri
  olan REST API.
? A task tracking API for small teams. Tasks have a title, description, due date and status (todo, in progress, done). It
  has endpoints to create, list, filter by status, update and delete tasks.
: Küçük ekipler için görev takip API'si. Görevler başlık, açıklama, son tarih ve durum (yapılacak, sürüyor, bitti) alanlarına
  sahip olacak. Görev oluşturma, listeleme, duruma göre süzme, güncelleme ve silme endpoint'leri bulunacak.
Python 3.12, FastAPI, pytest: Python 3.12, FastAPI, pytest
Include input validation and meaningful error codes (400, 404).: Girdi doğrulaması ve anlamlı hata kodları (400, 404) olsun.
Unit converter (Python, CLI): Birim dönüştürücü (Python, CLI)
A small CLI tool that converts length, weight and temperature units.: Uzunluk, ağırlık ve sıcaklık birimlerini dönüştüren
  küçük bir CLI aracı.
? A CLI tool that converts length, weight and temperature units. For example the command "convert 10 km mi" converts 10 kilometers
  to miles. It has a command that lists the supported units and a clear error message for an invalid unit.
: Uzunluk, ağırlık ve sıcaklık birimlerini dönüştüren CLI aracı. Örneğin "convert 10 km mi" komutu 10 kilometreyi mile çevirsin.
  Desteklenen birimleri listeleyen bir komut ve hatalı birim için açık hata mesajı olsun.
Use no external dependencies; standard library only.: Dış bağımlılık kullanma; yalnızca standard library.
Text helpers (Python, library): Metin yardımcıları (Python, library)
A library offering slug generation and text cleanup functions that handle Turkish characters correctly.: Türkçe karakterlere
  duyarlı slug üretme ve metin temizleme işlevleri sunan library.
? 'A text helpers library that handles Turkish characters correctly: slug generation for URLs, collapsing extra whitespace,
  word counting and smart truncation to a given length. Every function should be documented and type-hinted.'
: 'Türkçe karakterlere duyarlı metin yardımcıları library''si: URL için slug üretme, fazla boşlukları temizleme, kelime sayma
  ve belirli uzunlukta akıllı kısaltma. Her işlev belgelenmiş ve tip ipuçlu olsun.'
What is the project type?: Proje türü nedir?
Which languages and frameworks will be used? State the backend, frontend and package manager.: Hangi dil ve framework'ler
  kullanılacak? Backend, frontend ve package manager'ı belirt.
Which database will be used?: Hangi veritabanı kullanılacak?
Will a cache be used?: Önbellek kullanılacak mı?
Which observability services should Docker Compose include?: Docker Compose hangi observability servislerini içersin?
Should the backend project have a web UI?: Backend projesinde web UI olsun mu?
? 'How will the project be delivered? Docker: a container image; Executables: files built for every operating system the toolchain
  allows (Windows .exe, Linux, macOS); Scripts: run.sh/run.bat launchers; None: source code only.'
: 'Proje nasıl teslim edilecek? Docker: container imajı; Çalıştırılabilir dosya: araç zincirinin izin verdiği her işletim
  sistemi için derlenmiş dosyalar (Windows .exe, Linux, macOS); Script: run.sh/run.bat başlatıcıları; Yok: yalnızca kaynak
  kod.'
? What is the project scale? In a small project documents are kept short and the review only sends the design back on a critical
  finding.
: Proje ölçeği nedir? Küçük projede belgeler kısa tutulur ve inceleme yalnızca kritik bulguda tasarımı geri gönderir.
In which language should the agents write the documents?: Ajanlar belgeleri hangi dilde yazsın?
Are there any other technical or product constraints?: Başka teknik veya ürün kısıtları var mı?
