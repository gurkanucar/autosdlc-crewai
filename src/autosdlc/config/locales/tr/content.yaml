  klasörüne kopyalar ve yedeğin nereye gittiğini yazar. Bulunamayan kaynak klasör açık bir hata mesajı yazar ve sıfırdan farklı
  bir çıkış koduyla biter. Aynı davranış Linux/macOS (backup.sh) ve Windows (backup.bat) için sağlanır.'
POSIX sh and Windows batch (.bat), no dependencies: POSIX sh and Windows batch (.bat), no dependencies
? 'Only the standard tools of each system (cp, date / xcopy). The tests run in a Linux container: write a shell test script
