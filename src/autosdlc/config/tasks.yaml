# The application fills the variables that start with $ at run time. Prompts are written in English; the language of
# the documents the agents produce is set per project by language_rules (the $language variable).

# Appended to the end of every agent prompt (stage tasks, section editing and impact analysis included).
language_rules: |
  LANGUAGE RULES:
  - Write every document, report, explanation, heading and user-facing text in $language.
  - Do NOT translate technical terms, in ANY language: keep them in English exactly as they are, never translate or
    transliterate them: $terms. For example write "backend", not a translation of it. The same goes for product
    and tool names (Docker, pytest, SQLite, Playwright…). Keep protocol tokens exactly as specified in the task
    (VERDICT, START, SKIP, QUESTION, USER_QUESTION), Mermaid syntax, FR-xx/NFR-xx ids, file names, JSON keys
    and the severity words Critical/High/Medium/Low in English.
  - All code is English: variable, function/method, class, module, file and folder names, comments inside the code,
    docstrings, log and error messages, test names and commit messages. Do not use identifiers made of non-English
    words or containing non-ASCII letters (e.g. addProduct, not urunEkle). Only the UI texts the end user sees may
    be in the language the user asked for.

planning:
  description: |
    Project idea: $idea
    Architecture decisions and user constraints:
    $context
    Write the whole document in $language. Prepare a realistic project plan: goals, scope,
    out-of-scope work, stakeholders, milestones, deliverables, assumptions,
    dependencies and a risk table with mitigations.
    Follow the requested project type and technology; do not impose a specific language or framework.
    The project idea is the user's own words: everything it explicitly asks for (a desktop window, a web page, a
    storage format, a feature) is in scope; never list it as out of scope and never replace it with something
    simpler (e.g. a console program instead of the desktop app that was asked for). Project type desktop means a
    program with its own window that runs on the user's computer.
    Return Markdown only. Do not claim that tests or deployment have been done.
  expected_output: A concrete Markdown project plan in the project's document language.

analysis:
  description: |
    Project idea: $idea
    Earlier SDLC documents, architecture decisions and user constraints:
    $context
    Write the whole document in $language. Prepare numbered functional requirements such as FR-01,
    user stories and acceptance criteria, non-functional requirements such as NFR-01, and a
    traceability table linking the requirements to the planned tests. Describe data and API behavior
    only if the project has them. Follow the chosen technology and all decisions. Everything the project idea
    explicitly asks for gets a requirement. Return Markdown only.
  expected_output: Testable requirements and a traceability table in the project's document language.

design:
  description: |
    Project idea: $idea
    Earlier SDLC documents, architecture decisions and user constraints:
    $context
    Write the whole document in $language. Design the components, interfaces, error handling, test approach
    and deployment with the chosen technology.
    Include at least one Mermaid component diagram and one Mermaid sequence diagram.
    If a database is selected, include an erDiagram and the data schema with keys/indexes.
    If there is an API, write the endpoints, request/response contracts and HTTP status codes.
    Explain the rationale and trade-offs of the decisions. Return Markdown only.
  expected_output: An architecture document with Mermaid diagrams and a suitable data schema, in the project's document language.

review:
  description: |
    Project idea: $idea
    The design, requirements and decisions to review:
    $context
    Write the whole report in $language. Audit the design as an independent reviewer:
    does every FR have a counterpart in the design (traceability), how are the NFRs (performance,
    security, accessibility, etc.) met, are the API contracts and data schema consistent,
    are the user's chosen technology and constraints followed, are error handling and
    testability sufficient.
    Give the findings in a table "| No | Severity (Critical/High/Medium/Low) | Finding | Recommendation |"
    and write the severity as exactly one of the English words Critical, High, Medium, Low.
    If there is a finding of Critical or High severity the verdict must be REVISE, otherwise APPROVE.
    The last line of the report must be exactly "VERDICT: APPROVE" or "VERDICT: REVISE".
    Return Markdown only; do not rewrite the design yourself.
  expected_output: An architecture review report with a findings table and a VERDICT line, in the project's document language.

development:
  description: |
    Project idea: $idea
    SDLC documents, architecture decisions and user constraints:
    $context
    $feedback
    Follow the requested language, framework, package manager and UI simplicity exactly. Code is written in English.
    Return ONLY this JSON format: {"files": {"relative/path": "complete file content", ...}}.
    Package the project according to the `delivery` decision:
      docker: a Dockerfile suited to the chosen technology.
      binary: a POSIX sh script build.sh that builds standalone executables into dist/ ONLY for the operating
        systems in the `platforms` decision (windows, linux, macos, or all of them), named <app>-<os>-<arch>
        (with .exe for Windows); building more targets than asked only wastes time. Go: CGO_ENABLED=0 with
        GOOS/GOARCH windows/amd64; linux/amd64 and linux/arm64; darwin/amd64 and darwin/arm64.
        Rust: cargo build --release --target x86_64-pc-windows-gnu (Windows) or x86_64-unknown-linux-gnu (Linux);
        Rust cannot be built for macOS from Linux, so for macos build nothing for it and say so in the README.
        Add package: [sh, build.sh] to project.yaml. If the stack cannot build standalone executables from
        Linux (Python, Node.js, ...), do not fake it: write run.sh and run.bat launchers instead, leave package
        out and say so in the README. No Dockerfile.
      script: run.sh (POSIX sh) and run.bat launchers that run the application from source and pass the
        arguments through. No Dockerfile.
      none: no Dockerfile, no launchers.
    Match the effort to the project: a small CLI, desktop app or library needs no infrastructure files beyond these.
    Build outputs go only to dist/ or bin/: never write a compiled binary to the project root
    (e.g. go build -o dist/calc, not -o calc).
    Write a project.yaml with these keys:
      port: integer between 1024 and 65535 (only for a web service)
      setup: [executable, argument, ...] (optional dependency installation)
      unit_test: [executable, argument, ...] (required for CLI/desktop/library)
      api_test: [executable, argument, ...] (required for backend/fullstack)
      ui_test: [executable, argument, ...] (required if there is a web UI)
      start: [executable, argument, ...] (required if there is a web UI)
      package: [executable, argument, ...] (only for the binary delivery, e.g. [sh, build.sh])
    For a CLI, desktop or library project without a web UI write only setup, unit_test and (for binary delivery)
    package: there is no server to start, so leave api_test, ui_test and start out.
    Do not write test files: the Test Agent writes the tests under the tests/ folder.
    The test commands must run the tests folder, not a single file (e.g. pytest -q tests),
    so tests added later run too.
    Node's test runner does not accept a folder: pass test files or a glob such as
    `node --test tests/api/*.test.js` (with tsx: `node --import tsx --test tests/*.test.ts`), never `node --test tests/api`.
    When using pnpm, pin a compatible packageManager version. On pnpm 10.26+ allow only the
    specific native dependencies that need install scripts through `allowBuilds` in
    pnpm-workspace.yaml; never enable all dependency scripts. Include that file in Docker's
    dependency-install layer. Use the pinned manager consistently in project.yaml commands
    (for example `corepack pnpm@10.26.0 install`). On Windows, use pnpm's hoisted node linker
    when symlink setup fails.
    These commands run at the project root without a shell. For Python write "python" as the
    executable; the application picks the right interpreter.
    API tests must verify real HTTP behavior. UI tests must verify a visible interaction with Playwright on the
    application running at BASE_URL.
    Include the dependency files and all source files. If a Python setup command is used,
    also install pytest and the HTTP/browser test dependencies needed; the application installs
    these dependencies into a project-specific virtual environment.
    For a Python pytest-playwright test add
    [-p, pytest_playwright.pytest_playwright] to the ui_test list; automatic plugin loading is off.
    Use the environment variables TASK_DB_PATH for SQLite, DATABASE_URL for Postgres, REDIS_URL for Redis
    and OTEL_EXPORTER_OTLP_ENDPOINT for telemetry.
    During the tests a real, empty PostgreSQL database is at DATABASE_URL and a real Redis at REDIS_URL. The
    application creates its tables itself when it starts (or in the setup command); never replace the database with
    an in-memory fake.
    Files users upload (images, attachments) are stored on the file system in the folder named by the UPLOADS_DIR
    environment variable (default ./uploads, created if missing), never in the database; the database keeps only the
    generated file name. Generate the stored name yourself (never trust the uploaded name), check the type and size,
    and serve the files from that folder under /uploads. In Docker this folder is /data/uploads on a persistent volume.
    For a SQLite backend, the API test runner supplies an isolated TASK_DB_PATH; the app must still
    support a practical local default. In Docker, make the persistent data directory writable by the
    non-root runtime user. Copy the pnpm lockfile and workspace policy before installing dependencies;
    include native build tools in the build stage when the chosen package requires them.
    At most 40 files, at most 50 KB per file. Do not produce lock files (package-lock.json,
    pnpm-lock.yaml, go.sum, etc.); the setup command creates them.
    The tests live in a separate tests/ folder and cannot import the program's entry point, so ALL logic (loading
    data, selecting, formatting, calculating, business rules) must sit in importable modules and the entry point only
    wires them together:
      Go: packages such as internal/<name> with exported names; main.go only wires them and starts the program.
      Rust: src/lib.rs (and modules) is a library crate; src/main.rs only calls it; tests/ use the crate by name.
      Node.js: exported functions in src/ modules; the CLI entry file only reads arguments and calls them, and
        importing a module must have no side effects.
      Python: importable modules; guard the entry point with if __name__ == "__main__".
    The tests and the release build must compile the same code: never put application code or a dependency behind
    an optional cargo feature, a build flag or a build tag the test build leaves out (the only exception is the
    window file of a Go desktop app with its stub, described below). The package manager installs the newest
    version of a library, whose API may differ from the one you remember; write code for that current API.
    Never pin dependency versions from memory (an invented version breaks the build). Let the package manager
    resolve them in the setup command: Go [go, mod, tidy] with a go.mod that has no require lines; Rust
    [cargo, add, <crate>]; Node.js [npm, install, <package>]; Python [python, -m, pip, install, <package>].
    A desktop project (project type desktop, or an idea that asks for a window) must have a real window; never
    replace it with a console program. It keeps every decision out of the window code: the test container has no display,
    so tests cover the window-free logic only and nothing may open a window at import time or in a test. Go: put
    window code in files with a `//go:build windows` constraint plus a stub file for other systems, so that Linux
    builds and tests still compile; use a library that needs no cgo (CGO_ENABLED=0 builds). Rust: a pure-Rust GUI crate
    such as eframe/egui. Python: tkinter (ships with Python on Windows), created only inside a function that main calls.
    A simple local web page served by the program and opened in the default browser is an acceptable "window".
    Do not write a .env file; use .env.example if needed.
    Do not return a Markdown code block. When fixing, give complete file contents, not patches.
  expected_output: Valid JSON containing project.yaml, the packaging files the delivery decision asks for and complete source files.

testing:
  description: |
    Project idea: $idea
    SDLC documents, architecture decisions and user constraints:
    $context
    Application files:
    $files
    Write all explanations in $language. Produce tests suited to the chosen language and framework ONLY under
    the tests/ (or test/) folder; do not put test files at the project root. Return ONLY JSON of the form
    {"files": {"relative/path": "complete content"}}. Link the tests to the FR/NFR ids; cover successful
    and faulty usage. Write the related id (e.g. FR-01) explicitly in the name or description of every test;
    the traceability matrix is built from these ids.
    Every FR must be covered by at least one test. In a backend/fullstack project test the real API HTTP
    endpoints. A Postgres or Redis project gets a real, empty server at DATABASE_URL / REDIS_URL during the tests:
    use it, never mock the database, and keep each test independent of the data other tests leave behind (unique
    names or emails per test). If there is a web UI, open BASE_URL with Playwright
    and verify a visible interaction. Keep the test data isolated and deterministic.
    For Node.js ESM TypeScript projects using tsx, use `node --import tsx --test tests/*.test.ts`;
    `node --test tests/` is not a valid directory invocation. Check that every imported helper and
    exported function exists in the supplied application files before returning tests.
    Use ONLY functions, types and constants that appear in the application files above; never call a helper
    that is not there. If a test needs a helper, define it inside the test file itself. The developer cannot
    edit tests, so a test that references something missing can never pass. Go tests under tests/ form a
    separate package: they can only use exported (capitalised) identifiers of the application's packages, and
    every file in tests/ shares one package namespace, so never declare a package-level name that equals an
    imported package name (e.g. a function called exec while another file imports os/exec).
    Rust tests in tests/ are integration tests: they use the library crate by name and only its public items.
    Node.js and Python tests import the application's modules; they never start a window or a real GUI.
    Double-check that every file you return is complete, valid source (imports first, balanced braces, no "..."
    placeholders) before you answer.
    The test commands are specified in the application's project.yaml.
  expected_output: Valid JSON containing complete test files suited to the chosen technology.

deployment:
  description: |
    Project idea: $idea
    Earlier SDLC documents and the actual test result:
    $context
    Write the whole document in $language. Prepare a deployment guide that matches the `delivery` decision:
      docker: prerequisites, environment variables, docker compose build/up steps, health checks, rollback
        and backup. The Dockerfile and compose.yaml are already prepared; do not claim that the image was
        built or the application was deployed.
      binary: which file in dist/ to use on each operating system and how to run it (chmod +x on
        Linux/macOS), based only on the packaging result in the context; if no executables were built, say
        so and explain how to run the project from source or with the launcher scripts.
      script: prerequisites and how to run run.sh / run.bat.
      none: how to install and use the project from source.
    Describe only what the project has: no Docker, health checks, rollback or infrastructure that the
    delivery does not include. Keep it proportional to the project; a small CLI needs a short guide.
    If the tests failed, say so clearly.
    Do not write secrets. Return Markdown only.
  expected_output: A deployment guide that reflects the real situation, in the project's document language.

maintenance:
  description: |
    Project idea: $idea
    Earlier SDLC documents and the actual test result:
    $context
    Write the whole document in $language. Write the responsibilities, monitoring signals, incident
    response, backup/restore, dependency updates, known limits, open test failures and prioritized
    improvements. Do not claim that problems were resolved or that production monitoring exists.
    Return Markdown only.
  expected_output: An actionable maintenance plan in the project's document language.

# The following are not SDLC stages; they are used for the user's document and change interventions.
section_edit:
  description: |
    Project idea: $idea
    Context (decisions and the relevant earlier documents):
    $context
    The whole document:
    $document
    The section to work on:
    $section
    The user's instruction: $instruction
    Operation: $operation
    Write in $language and follow the document's existing format (heading level, table/bullet structure).
    Do not change existing FR/NFR ids; if a new requirement is added use the number after the
    largest number in the document. Do not change anything outside the instruction.
    Return Markdown only; do not add explanations, a preamble or a code fence.
  expected_output: Only the new version of the section or the new content to add (Markdown).

section_question:
  description: |
    Project idea: $idea
    Context (decisions and the relevant earlier documents):
    $context
    The whole document:
    $document
    The section the user asked about:
    $section
    Question: $instruction
    Operation: $operation
    Answer in $language, briefly and concretely. Base your reasoning on the document and the decisions;
    do not describe something that is not in the document as if it were. If useful, suggest how the
    section could be improved but do not rewrite the document.
  expected_output: A short answer with reasoning, in the project's document language.

impact:
  description: |
    Project idea: $idea
    Existing SDLC documents, traceability matrix and file list:
    $context
    Change request:
    $change
    Write an impact analysis report in $language:
    1. Summary and type of the request (new feature / bug / change).
    2. Affected requirements: the FR/NFR ids that will change and the new requirements to add.
    3. Affected design sections and API/data schema changes.
    4. Source files likely to change and tests to add/update.
    5. Risks and areas with regression risk.
    6. "## Open questions": if the request is unclear or has more than one reasonable interpretation, list the
       points the user must clarify before it is applied, each on its own line in the form
       "QUESTION: <one clear question>" (at most 5). Do not assume; leave the decision to the user.
       If there is really no uncertainty write only "No open questions." in this section.
    For bug requests assume that a test reproducing the bug is written first.
    The second-to-last line must name the stages NOT affected by this change that need no rewriting,
    like "SKIP: review, deployment, maintenance" (options: analysis, design, review,
    deployment, maintenance; development and testing are never skipped). Deployment may be skipped if the port,
    dependencies, environment variables and way of running do not change; maintenance if monitoring/operations
    are unaffected; review if the design does not change. If no stage can be skipped write "SKIP: none".
    The last line of the report must be exactly in this form and name the first stage the change
    must touch: "START: analysis" (new/changed requirement),
    "START: design" (requirements the same, design changes) or
    "START: development" (code/bug fix only).
    Return Markdown only.
  expected_output: An impact analysis listing the affected items and ending with a START line, in the project's document language.
