# $ ile başlayan değişkenleri uygulama çalışma sırasında doldurur.
planning:
  description: |
    Proje fikri: $idea
    Mimari kararlar ve kullanıcı kısıtları:
    $context
    Bütün belgeyi Türkçe yaz. Gerçekçi bir proje planı hazırla: hedefler, kapsam,
    kapsam dışı işler, paydaşlar, kilometre taşları, teslimatlar, varsayımlar,
    bağımlılıklar ve önlemleriyle birlikte risk tablosu.
    İstenen proje türüne ve teknolojiye uy; belirli bir dil veya çatı dayatma.
    Yalnızca Markdown döndür. Testlerin ya da dağıtımın yapıldığını iddia etme.
  expected_output: Türkçe ve somut bir Markdown proje planı.

analysis:
  description: |
    Proje fikri: $idea
    Önceki SDLC belgeleri, mimari kararlar ve kullanıcı kısıtları:
    $context
    Bütün belgeyi Türkçe yaz. FR-01 gibi numaralı işlevsel gereksinimler,
    kullanıcı hikâyeleri ve kabul kriterleri, NFR-01 gibi işlevsel olmayan
    gereksinimler ve gereksinimleri planlanan testlere bağlayan izlenebilirlik
    tablosu hazırla. Veri ve API davranışını yalnızca projede varsa açıkla.
    Seçilen teknolojiye ve tüm kararlara uy. Yalnızca Markdown döndür.
  expected_output: Türkçe, sınanabilir gereksinimler ve izlenebilirlik tablosu.

design:
  description: |
    Proje fikri: $idea
    Önceki SDLC belgeleri, mimari kararlar ve kullanıcı kısıtları:
    $context
    Bütün belgeyi Türkçe yaz. Seçilen teknolojiyle bileşenleri, arayüzleri,
    hata yönetimini, test yaklaşımını ve dağıtımı tasarla.
    En az bir Mermaid bileşen diyagramı ve bir Mermaid sıralama diyagramı ekle.
    Veritabanı seçildiyse erDiagram ve anahtarları/indeksleriyle veri şeması ekle.
    API varsa uç noktaları, istek/yanıt sözleşmelerini ve durum kodlarını yaz.
    Kararların gerekçelerini ve ödünleşimleri açıkla. Yalnızca Markdown döndür.
  expected_output: Türkçe mimari belgesi, Mermaid diyagramları ve uygun veri şeması.

development:
  description: |
    Proje fikri: $idea
    SDLC belgeleri, mimari kararlar ve kullanıcı kısıtları:
    $context
    $feedback
    İstenen dil, çatı, paket yöneticisi ve arayüz sadeliğine tam uy.
    YALNIZCA şu JSON biçimini döndür: {"files": {"goreli/yol": "dosyanın tam içeriği", ...}}.
    Seçilen teknolojiye uygun Dockerfile ve şu anahtarları taşıyan project.yaml üret:
      port: 1024-65535 arasında tamsayı (web hizmetinin portu)
      setup: [çalıştırılabilir, argüman, ...] (isteğe bağlı bağımlılık kurulumu)
      unit_test: [çalıştırılabilir, argüman, ...] (CLI/kütüphane için zorunlu)
      api_test: [çalıştırılabilir, argüman, ...] (backend/fullstack için zorunlu)
      ui_test: [çalıştırılabilir, argüman, ...] (web arayüzü varsa zorunlu)
      start: [çalıştırılabilir, argüman, ...] (web arayüzü varsa zorunlu)
    Bu komutlar proje kökünde kabuk kullanılmadan çalıştırılır. Python için
    çalıştırılabilir olarak "python" yaz; uygulama doğru yorumlayıcıyı seçer.
    API testleri gerçek HTTP davranışını sınamalı. Arayüz testleri Playwright ile
    BASE_URL adresindeki çalışan uygulamada görünür bir etkileşimi doğrulamalı.
    Bağımlılık dosyalarını ve tüm kaynak dosyalarını ekle. Python setup komutu
    kullanılıyorsa pytest ve gereken HTTP/tarayıcı test bağımlılıklarını da kur;
    uygulama bu bağımlılıkları projeye özel sanal ortama yükler.
    Python pytest-playwright testi için ui_test listesine
    [-p, pytest_playwright.pytest_playwright] ekle; otomatik eklenti yükleme kapalı.
    SQLite için TASK_DB_PATH, Postgres için DATABASE_URL, Redis için REDIS_URL,
    telemetri için OTEL_EXPORTER_OTLP_ENDPOINT ortam değişkenlerini kullan.
    Markdown kod bloğu döndürme. Düzeltmede yama değil tam dosya içeriği ver.
  expected_output: Dockerfile, project.yaml ve eksiksiz kaynak dosyalarını içeren geçerli JSON.

testing:
  description: |
    Proje fikri: $idea
    SDLC belgeleri, mimari kararlar ve kullanıcı kısıtları:
    $context
    Uygulama dosyaları:
    $files
    Bütün açıklamaları Türkçe yaz. Seçilen dil ve çatıya uygun testleri tests/
    veya test/ altında üret. YALNIZCA {"files": {"goreli/yol": "tam içerik"}}
    biçiminde JSON döndür. Testleri FR/NFR kimlikleriyle ilişkilendir; başarılı
    ve hatalı kullanımları kapsa. Backend/fullstack projede gerçek API HTTP
    uç noktalarını sına. Web arayüzü varsa Playwright ile BASE_URL adresini aç
    ve görünür bir etkileşimi doğrula. Test verisini yalıt ve deterministik tut.
    Test komutları uygulamanın project.yaml dosyasında belirtilmiştir.
  expected_output: Seçilen teknolojiye uygun eksiksiz test dosyalarını içeren geçerli JSON.

deployment:
  description: |
    Proje fikri: $idea
    Önceki SDLC belgeleri ve gerçek test sonucu:
    $context
    Bütün belgeyi Türkçe yaz. Seçilen teknoloji için ön koşulları, ortam
    değişkenlerini, docker compose build/up adımlarını, sağlık kontrollerini,
    geri alma ve yedekleme adımlarını içeren dağıtım kılavuzu hazırla.
    Dockerfile ve compose.yaml hazırlanmıştır; imajın oluşturulduğunu veya
    uygulamanın dağıtıldığını iddia etme. Testler başarısızsa açıkça belirt.
    Gizli anahtarları yazma. Yalnızca Markdown döndür.
  expected_output: Türkçe, gerçek durumu yansıtan dağıtım kılavuzu.

maintenance:
  description: |
    Proje fikri: $idea
    Önceki SDLC belgeleri ve gerçek test sonucu:
    $context
    Bütün belgeyi Türkçe yaz. Sorumlulukları, izleme sinyallerini, olay
    müdahalesini, yedekleme/geri yüklemeyi, bağımlılık güncellemelerini,
    bilinen sınırları, açık test hatalarını ve öncelikli iyileştirmeleri yaz.
    Sorunların çözüldüğünü veya üretimde izleme yapıldığını iddia etme.
    Yalnızca Markdown döndür.
  expected_output: Türkçe ve uygulanabilir bakım planı.
