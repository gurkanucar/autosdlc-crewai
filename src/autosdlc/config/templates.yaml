# Example project templates shown in the UI. Each one fills the form; the user can change it afterwards.
# The decisions keys are the same as in questions.yaml. Idea at most 1000, stack at most 200, constraints at most 4000 characters.
# Keep the catalog small: tiny, sensible examples; desktop apps first, then console apps that keep running and read what
# the user types (no tools that only take command-line arguments), one web app, one API.
# The idea is written the way a user would say it; technical hints belong to stack and constraints.
# Texts are English source strings; other languages are in locales/<code>/content.yaml.
- id: quick-demo
  title: ⚡ Quick demo — temperature converter (Python, library)
  description: The smallest example to see the concept in a few minutes; two functions, one test file, short documents.
  idea: 'A small Python library that converts between Celsius and Fahrenheit: celsius_to_fahrenheit and fahrenheit_to_celsius
    functions. Raise a ValueError for values below absolute zero (-273.15 °C).'
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    delivery: none
    constraints: 'Use no external dependencies; no setup command is needed. Fewest files: one source module and a
      single test file under tests/. Keep every SDLC document short (at most half a page each); write at most 3 FRs
      and 2 NFRs.'
- id: todo-desktop-rust
  title: To-do list (Rust, desktop window)
  description: 'A small to-do list app with its own window: add, tick off and delete tasks; saved to a JSONL file. Built as a Windows .exe.'
  idea: 'A simple to-do list desktop app. You can add a task, mark it as done or not done, and delete it. The list is
    saved, so it is still there after a restart.'
  decisions:
    scale: small
    project_type: desktop
    stack: Rust (stable), eframe/egui, serde_json
    delivery: binary
    platforms: windows
    constraints: 'Save the tasks to a JSONL file (one task per line with id, text and done) next to the program. Keep
      the task list and the JSONL load/save logic in src/lib.rs without any egui code; src/main.rs only draws the window
      and calls the library. Tests use temporary files and never open a window. Fewest files: Cargo.toml, src/lib.rs,
      src/main.rs. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: calculator-desktop-python
  title: Calculator app (Python, desktop window)
  description: A small desktop calculator with a window and buttons; starts with a double click on run.bat (Python must be installed).
  idea: 'A desktop calculator app with a window: a display, the digit buttons, plus, minus, multiply and divide buttons,
    a clear button and an equals button. Dividing by zero shows "Error" on the display instead of crashing.'
  decisions:
    scale: small
    project_type: desktop
    stack: Python 3.12, tkinter, pytest
    delivery: script
    constraints: 'Use tkinter and the standard library only. Keep all calculation and input-handling logic in a module
      that does not import tkinter; the window code only draws the buttons and calls that module, and creates the window
      inside a function (never at import time), because the tests run without a display. Fewest files: calculator.py
      (logic), app.py (window), run.bat, run.sh. Keep every SDLC document short (at most half a page each); write at most
      3 FRs and 2 NFRs.'
- id: calculator-desktop-go
  title: Calculator app (Go, one .exe)
  description: A calculator in a single file you double-click; opens in its own browser tab. Built as a Windows .exe.
  idea: 'A calculator app in a single file: double-click it and a calculator opens, with a display, the digit buttons,
    plus, minus, multiply and divide buttons, a clear button and an equals button. Dividing by zero shows "Error"
    instead of crashing.'
  decisions:
    scale: small
    project_type: desktop
    stack: Go 1.24, standard library; the interface is a small web page built into the program
    delivery: binary
    platforms: windows
    constraints: 'Use the Go standard library only. The HTML/CSS/JS is embedded in the program (embed package), so no
      other file is needed next to it. The program starts a tiny local web server that only this computer can reach and
      opens the page in the default browser; if that fails it prints the address. Put the calculation and the HTTP
      handler in an importable package under internal/; main.go only starts the server. Test the handler with
      net/http/httptest. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: timer-desktop-python
  title: Focus timer (Python, desktop window)
  description: A small Pomodoro-style timer window with start, pause and reset; starts with a double click on run.bat (Python must be installed).
  idea: 'A small focus timer desktop app: a window shows a 25-minute countdown with start, pause and reset buttons. When
    the time is up the window says so and plays a short sound. The length can be changed between 1 and 60 minutes.'
  decisions:
    scale: small
    project_type: desktop
    stack: Python 3.12, tkinter, pytest
    delivery: script
    constraints: 'Use tkinter and the standard library only. Keep the timer logic (remaining time, start, pause, reset,
      length limits) in a module that does not import tkinter and takes the current time as an argument, so tests need no
      waiting; the window code only draws and calls it, and creates the window inside a function (never at import time),
      because the tests run without a display. Fewest files: timer.py (logic), app.py (window), run.bat, run.sh. Keep
      every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: calculator-cli
  title: Calculator (Python, console)
  description: A console calculator that keeps running; type an expression, press Enter, get the answer. Starts with a double click on run.bat (Python must be installed).
  idea: 'A console calculator that keeps running. It opens with a one-line help and a "> " prompt; you type an expression
    such as 6 / 3 or 2 + 3 * (4 - 1) and press Enter, and it prints the result. It supports +, -, *, / and parentheses,
    and "ans" stands for the last result. A wrong input or a division by zero prints a short error and the calculator
    keeps running. "help" shows the help again, "quit" or "exit" closes it.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, standard library, pytest
    delivery: script
    constraints: 'Standard library only and never eval(): parse the expression with a small tokenizer and parser that
      respects operator precedence and parentheses. Put the parsing and calculation in calculator.py and the prompt loop
      in a function run(input_stream, output_stream) in the same module, so the tests drive a whole session with
      io.StringIO; main.py only calls run(sys.stdin, sys.stdout) and ends quietly on Ctrl+C or end of input. Fewest files:
      calculator.py, main.py, run.bat, run.sh and one test file under tests/. Keep every SDLC document short (at most
      half a page each); write at most 3 FRs and 2 NFRs.'
- id: todo-cli-python
  title: To-do list (Python, console)
  description: A console to-do list that keeps running; add, list, tick off and delete tasks by typing commands. Saved to a JSONL file. Starts with a double click on run.bat (Python must be installed).
  idea: 'A to-do list in the console. It opens with a "> " prompt and keeps running: "add buy milk" adds a task, "list"
    shows all tasks with their numbers and whether they are done, "done 2" ticks task 2 off, "undo 2" marks it as not
    done, "delete 2" removes it, "help" shows the commands and "quit" closes it. The tasks are saved, so they are still
    there after a restart. A wrong command or task number prints a short message and the program keeps running.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, standard library, pytest
    delivery: script
    constraints: 'Standard library only. Save the tasks to tasks.jsonl (one task per line with id, text and done) in the
      folder given by the TODO_DIR environment variable, or next to the program when it is not set. Put the commands in
      todo.py as a function handle_line(line, store) that returns the text to print, the JSONL load/save in store.py,
      and the prompt loop in a function run(input_stream, output_stream, store) so the tests drive a whole session with
      io.StringIO and a temporary folder; main.py only calls it with sys.stdin and sys.stdout and ends quietly on Ctrl+C
      or end of input. Fewest files: todo.py, store.py, main.py, run.bat, run.sh and one test file under tests/. Keep every
      SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: password-generator-go
  title: Password generator (Go, console)
  description: Double-click it and a console window shows a fresh password on every Enter; ready-to-run executables for Windows (.exe), Linux and macOS.
  idea: 'An interactive password generator. Double-click it and a console window opens and shows a random 16-character
    password. Pressing Enter shows a new one; typing a number between 8 and 64 changes the length; "s" turns symbols on
    or off; "q" closes it. The current settings are shown above the prompt. Every password contains at least one
    lowercase letter, one uppercase letter and one digit (and one symbol when symbols are on). A wrong input prints a
    short message and the program keeps running.'
  decisions:
    scale: small
    project_type: cli
    stack: Go 1.24, standard library, go test
    delivery: binary
    platforms: all
    constraints: 'Use the Go standard library only; draw the random numbers from crypto/rand, not math/rand. Put the
      generator and the prompt loop in one package under internal/; the loop is a function Run(in io.Reader, out
      io.Writer) so the tests drive a whole session with strings.Reader and bytes.Buffer, and it returns at end of input.
      main.go only calls it with os.Stdin and os.Stdout. Fewest files: main.go and that package. Keep every SDLC document
      short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: todo-web-node
  title: To-do list (Node.js, web app)
  description: 'A simple to-do list web page: add tasks, tick them off and delete them; runs in Docker.'
  idea: 'A simple to-do list web app. You can add a task, mark it as done or not done, and delete it. The list is
    saved, so it is still there after a restart.'
  decisions:
    scale: small
    project_type: fullstack
    stack: Node.js (Express), pnpm, plain HTML/CSS/JS interface
    database: sqlite
    cache: none
    observability: none
    delivery: docker
    constraints: 'Do not use a framework in the frontend, write plain HTML/CSS/JS. Prefer a SQLite solution that needs
      no native compilation. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: event-registration-node
  title: Event registration (Node.js + React, PostgreSQL, web app)
  description: Organizers publish events with a capacity and a cover image, users sign up for them; user, organizer and admin
    roles. Express + TypeORM API, React + Ant Design, PostgreSQL; runs with Docker Compose.
  idea: 'An event registration web app. People can sign up and log in. Organizers create events with a title, a description,
    a date, a capacity and a cover image they upload, and see who registered for their own events. Users see the upcoming
    events with their images and the number of free places, register for an event and cancel their registration. A user cannot
    register twice for the same event, and registration closes when the event is full or has already taken place. There are
    three roles: user, organizer and admin; an admin changes other users'' roles. The first user who signs up becomes the
    admin.'
  decisions:
    scale: small
    project_type: fullstack
    stack: Node.js 22, Express 5, TypeORM + PostgreSQL (plain JavaScript ES modules), zod, pnpm; React 18 + Vite + axios +
      Ant Design 5 frontend
    database: postgres
    cache: none
    observability: none
    delivery: docker
    constraints: 'Two folders, each organized by feature. server/: Express API under /api in plain JavaScript (no TypeScript
      build); server/src/features/<auth|users|events|registrations>/ each hold that feature''s TypeORM EntitySchema (no decorators),
      routes, service and zod schemas; the TypeORM DataSource (DATABASE_URL, synchronize: true creates the tables at startup),
      config, error class and the auth and validation middleware live in server/src/common/. Validate every request body,
      params and query with zod; an invalid request answers 400 {error: {code: ''VALIDATION_ERROR'', message, details: [{field,
      message}]}}, and every error has the {error: {code, message}} shape. web/: React 18 + Vite + axios + Ant Design 5 (antd,
      @ant-design/icons and dayjs as direct dependencies), with web/src/features/<auth|events|admin>/ and the api client,
      auth context and layout in web/src/shared/; import ''antd/dist/reset.css'' once, wrap the app in ConfigProvider (Turkish
      locale) and antd''s App, and build every screen from antd components (Layout, Menu, Form with a name, Card, Table, Upload,
      DatePicker), never unstyled HTML. The axios instance has baseURL ''/api'', so calls use ''/events'', never ''/api/events''.
      After a logout the next login opens the events page. Use react ^18, antd ^5 and express ^5, never "latest" for them.
      pnpm-workspace.yaml lists server and web; the root package.json has only playwright and pg as devDependencies. All
      tests use node:test: tests/api/*.test.js and tests/ui/*.test.js (chromium from ''playwright''). project.yaml, exactly:
      setup: [sh, -c, "corepack pnpm@10.26.0 install --no-frozen-lockfile && corepack pnpm@10.26.0 --dir web run build"],
      api_test: [node, --test, tests/api/*.test.js], ui_test: [sh, -c, "corepack pnpm@10.26.0 exec playwright install chromium
      && node --test tests/ui/*.test.js"], start: [node, server/src/index.js]; the server also serves web/dist and /uploads
      on the same port. Hash passwords with bcryptjs. Login returns a JWT signed with JWT_SECRET
      (no default: stop at startup when it is missing) that the client sends as Authorization: Bearer <token> (axios interceptor);
      check the role on the server for every protected route (401 not logged in, 403 role not allowed). Register inside one
      transaction with a pessimistic write lock on the event row, so two people cannot take the last place; a full event,
      a past event or a second registration answers 409. Creating an event with a past date is allowed (tests
      need it). Upload the cover with multer: JPEG, PNG or WebP (checked by its first bytes) up to 5 MB, saved in
      UPLOADS_DIR under a generated name; other files answer 400, and the uploaded file is deleted whenever the request fails.
      UI tests create users and events through the API and use the browser only to log in and to register or cancel. A test
      file that opens a database connection closes it in after(), or the test process never
      exits. Keep every SDLC document short (at most half a page each); at most 4 FRs and 2 NFRs.'
- id: task-api
  title: Task API (Python, web API)
  description: A small REST API to create, list, update and delete tasks; runs in Docker.
  idea: 'A small task tracking API. A task has a title and a status (todo or done). The API can create a task, list
    the tasks (optionally only those with a given status), update a task and delete a task.'
  decisions:
    scale: small
    project_type: backend
    stack: Python 3.12, FastAPI, pytest
    database: sqlite
    cache: none
    observability: none
    ui: none
    delivery: docker
    constraints: 'Include input validation and meaningful error codes (400, 404). Keep every SDLC document short (at most
      half a page each); write at most 3 FRs and 2 NFRs.'
- id: guessing-game-python
  title: Number guessing game (Python, console)
  description: The computer picks a number between 1 and 100 and you guess it in the console; starts with a double click on run.bat (Python must be installed).
  idea: 'A number guessing game in the console. The computer picks a secret number between 1 and 100; you type a guess
    and press Enter, and it answers "higher" or "lower" until you find it. Then it shows how many guesses you needed and
    your best score so far, and asks whether to play again. Input that is not a number between 1 and 100 prints a short
    message and does not count as a guess. "quit" ends the game at any time.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, standard library, pytest
    delivery: script
    constraints: 'Standard library only. Put the game in game.py: a function play(input_stream, output_stream, rng) that
      takes a random.Random, so the tests use a seeded one and drive whole games with io.StringIO; main.py only calls
      it with sys.stdin, sys.stdout and random.Random() and ends quietly on Ctrl+C or end of input. Fewest files: game.py,
      main.py, run.bat, run.sh and one test file under tests/. Keep every SDLC document short (at most half a page each);
      write at most 3 FRs and 2 NFRs.'
- id: expense-notebook-node
  title: Expense notebook (Node.js, console)
  description: Write down your spending in the console and see the list and the totals; saved to a file. Starts with a double click on run.bat (Node.js must be installed).
  idea: 'A small expense notebook in the console. It opens with a "> " prompt and keeps running: "add 45.50 groceries"
    records an expense with today''s date, "list" shows all expenses with their numbers, "total" shows the sum and the
    sum per category, "delete 3" removes expense number 3, "help" shows the commands and "quit" closes it. The expenses
    are saved, so they are still there after a restart. A wrong command or amount prints a short message and the
    notebook keeps running.'
  decisions:
    scale: small
    project_type: cli
    stack: Node.js 22 (ES modules, node:readline), node:test
    delivery: script
    constraints: 'No dependencies, so no setup command. Keep amounts as whole cents (integers), never floating point.
      Save the expenses to expenses.jsonl (one expense per line) in the folder given by the EXPENSES_DIR environment
      variable, or next to the program when it is not set. Put the commands in src/notebook.js as a function
      handleLine(line, store) that returns the text to print, and the file load/save in src/store.js; src/main.js only
      wires them to node:readline. Importing a module has no side effects. The tests use temporary folders and run with
      [node, --test, tests/*.test.js]. Fewest files: src/main.js, src/notebook.js, src/store.js, package.json, run.bat,
      run.sh and one test file. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: acrostic-poet-python
  title: Acrostic poem writer (Python, console, AI)
  description: Type a word and an AI model writes an acrostic poem whose lines start with its letters; poems are saved and can be listed. Asks for the OpenCode Go API key once. Starts with a double click on run.bat (Python must be installed).
  idea: 'A console app that writes acrostic poems with an AI model. On the first start it asks for the OpenCode Go API
    key once (the typing is hidden) and remembers it, so it is not asked again. Then it keeps running with a "> " prompt:
    typing a word, optionally followed by a theme ("SPRING: hope"), writes a poem whose lines start with the letters of
    the word in order, shows it and saves it. "list" shows the saved poems with their numbers, words and dates, "show 3"
    prints poem number 3 again, "delete 3" removes it, "key" asks for a new API key, "help" shows the commands and
    "quit" closes it. The poems are still there after a restart. A network or key error prints a short message and the
    app keeps running.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, standard library (urllib.request, getpass, json), pytest; OpenCode Go model glm-5.3-flash
    delivery: script
    constraints: 'Standard library only, so no setup command. The model is called with POST
      https://opencode.ai/inference/go/openai/v1/chat/completions (OpenAI-compatible body {model, messages}, header
      Authorization: Bearer <key>, answer in choices[0].message.content); the model is glm-5.3-flash unless the
      OPENCODE_MODEL environment variable names another, and a request times out after 120 seconds. The key comes from
      the OPENCODE_API_KEY environment variable when it is set, otherwise from config.json, otherwise it is asked with
      getpass and saved to config.json; never print the key. The poem is written in the language of the word. Check that
      the first letters of the poem''s lines spell the word (ignoring case, empty lines and punctuation, Turkish letters
      included); if they do not, ask the model again, at most two more times, and then say it failed without saving.
      Save the poems to poems.jsonl (one poem per line with id, word, theme, text, model and created_at) and config.json
      in the folder given by the POET_DATA_DIR environment variable, or next to the program when it is not set;
      .gitignore lists both files. Put the acrostic check, the prompt and the jsonl store in poet.py and the command loop
      in a function run(input_stream, output_stream, store, complete, ask_key), where complete(messages) returns the
      model''s text; run() writes the "> " prompt to output_stream before every read, also when the
      input is not a terminal, and returns at end of input. The HTTP call lives in client.py. main.py only wires them together and ends quietly on Ctrl+C or
      end of input. The tests never call the network or need a key: they pass a fake complete and temporary folders.
      Fewest files: poet.py, client.py, main.py, run.bat, run.sh, .gitignore and one test file under tests/. Keep every
      SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
