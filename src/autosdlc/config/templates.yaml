# Arayüzdeki "Örnek proje şablonu" listesi. Her şablon formu doldurur; kullanıcı sonra değiştirebilir.
# decisions anahtarları questions.yaml ile aynıdır. Fikir en fazla 1000, yığın en fazla 200 karakter olmalı.
# İlk şablon bilerek çok küçüktür: konsepti birkaç dakikada uçtan uca görmek için (sunucu, API/UI testi, bağımlılık yok).
- id: hizli-demo
  title: ⚡ Hızlı demo — sıcaklık dönüştürücü (Python, library)
  description: Konsepti birkaç dakikada görmek için en küçük örnek; iki fonksiyon, tek test dosyası, kısa belgeler.
  idea: >-
    Celsius ve Fahrenheit arasında dönüşüm yapan küçük bir Python library'si: celsius_to_fahrenheit
    ve fahrenheit_to_celsius fonksiyonları. Mutlak sıfırın (-273.15 °C) altındaki değerler için
    ValueError fırlatılsın.
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    constraints: >-
      Dış bağımlılık kullanma, setup komutu gerekmez. En az dosya: tek kaynak modülü,
      tests/ altında tek test dosyası, project.yaml ve Dockerfile. Bütün SDLC belgeleri kısa olsun (her biri en fazla
      yarım sayfa); en fazla 3 FR ve 2 NFR yaz.

- id: envanter-takip
  title: Envanter takip uygulaması (Node.js, fullstack)
  description: Ürün adı, kategori ve konum bilgisiyle stok kaydı tutan basit bir web uygulaması.
  idea: >-
    Basit bir envanter takip uygulaması. Ürünler; ürün adı, kategori ve konum (depo/raf)
    bilgisiyle saklanacak. Ürün ekleme, düzenleme, silme ve listeleme olacak; liste ürün adına
    göre aranabilecek, kategoriye ve konuma göre süzülebilecek.
  decisions:
    project_type: fullstack
    stack: Node.js (Express), pnpm, sade HTML/CSS/JS arayüz
    database: sqlite
    cache: none
    observability: none
    constraints: >-
      Frontend'de framework kullanma, düz HTML/CSS/JS yaz. Kullanıcı arayüzü metinleri Türkçe olsun.
      Native derleme gerektirmeyen bir SQLite çözümü tercih et.

- id: gorev-api
  title: Görev takip API'si (Python, backend)
  description: Görev oluşturma, listeleme, tamamlama ve silme endpoint'leri olan REST API.
  idea: >-
    Küçük ekipler için görev takip API'si. Görevler başlık, açıklama, son tarih ve durum
    (yapılacak, sürüyor, bitti) alanlarına sahip olacak. Görev oluşturma, listeleme, duruma göre
    süzme, güncelleme ve silme endpoint'leri bulunacak.
  decisions:
    project_type: backend
    stack: Python 3.12, FastAPI, pytest
    database: sqlite
    cache: none
    observability: none
    ui: none
    constraints: Girdi doğrulaması ve anlamlı hata kodları (400, 404) olsun.

- id: birim-donusturucu-cli
  title: Birim dönüştürücü (Python, CLI)
  description: Uzunluk, ağırlık ve sıcaklık birimlerini dönüştüren küçük bir CLI aracı.
  idea: >-
    Uzunluk, ağırlık ve sıcaklık birimlerini dönüştüren CLI aracı. Örneğin
    "convert 10 km mi" komutu 10 kilometreyi mile çevirsin. Desteklenen birimleri listeleyen
    bir komut ve hatalı birim için açık hata mesajı olsun.
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, argparse, pytest
    constraints: Dış bağımlılık kullanma; yalnızca standard library.

- id: metin-kutuphanesi
  title: Metin yardımcıları (Python, library)
  description: Türkçe karakterlere duyarlı slug üretme ve metin temizleme işlevleri sunan library.
  idea: >-
    Türkçe karakterlere duyarlı metin yardımcıları library'si: URL için slug üretme,
    fazla boşlukları temizleme, kelime sayma ve belirli uzunlukta akıllı kısaltma.
    Her işlev belgelenmiş ve tip ipuçlu olsun.
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    constraints: Dış bağımlılık kullanma; yalnızca standard library.
