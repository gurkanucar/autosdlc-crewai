# Example project templates shown in the UI. Each one fills the form; the user can change it afterwards.
# The decisions keys are the same as in questions.yaml. Idea at most 1000, stack at most 200 characters.
# Keep the catalog small: tiny, sensible examples; desktop apps first, only a couple of CLIs, one web app, one API, scripts.
# The idea is written the way a user would say it; technical hints belong to stack and constraints.
# Texts are English source strings; other languages are in locales/<code>/content.yaml.
- id: quick-demo
  title: ⚡ Quick demo — temperature converter (Python, library)
  description: The smallest example to see the concept in a few minutes; two functions, one test file, short documents.
  idea: 'A small Python library that converts between Celsius and Fahrenheit: celsius_to_fahrenheit and fahrenheit_to_celsius
    functions. Raise a ValueError for values below absolute zero (-273.15 °C).'
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    delivery: none
    constraints: 'Use no external dependencies; no setup command is needed. Fewest files: one source module and a
      single test file under tests/. Keep every SDLC document short (at most half a page each); write at most 3 FRs
      and 2 NFRs.'
- id: todo-desktop-rust
  title: To-do list (Rust, desktop window)
  description: 'A small to-do list app with its own window: add, tick off and delete tasks; saved to a JSONL file. Built as a Windows .exe.'
  idea: 'A simple to-do list desktop app. You can add a task, mark it as done or not done, and delete it. The list is
    saved, so it is still there after a restart.'
  decisions:
    scale: small
    project_type: desktop
    stack: Rust (stable), eframe/egui, serde_json
    delivery: binary
    platforms: windows
    constraints: 'Save the tasks to a JSONL file (one task per line with id, text and done) next to the program. Keep
      the task list and the JSONL load/save logic in src/lib.rs without any egui code; src/main.rs only draws the window
      and calls the library. Tests use temporary files and never open a window. Fewest files: Cargo.toml, src/lib.rs,
      src/main.rs. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: calculator-desktop-python
  title: Calculator app (Python, desktop window)
  description: A small desktop calculator with a window and buttons; starts with a double click on run.bat.
  idea: 'A desktop calculator app with a window: a display, the digit buttons, plus, minus, multiply and divide buttons,
    a clear button and an equals button. Dividing by zero shows "Error" on the display instead of crashing.'
  decisions:
    scale: small
    project_type: desktop
    stack: Python 3.12, tkinter, pytest
    delivery: script
    constraints: 'Use tkinter and the standard library only. Keep all calculation and input-handling logic in a module
      that does not import tkinter; the window code only draws the buttons and calls that module, and creates the window
      inside a function (never at import time), because the tests run without a display. Fewest files: calculator.py
      (logic), app.py (window), run.bat, run.sh. Keep every SDLC document short (at most half a page each); write at most
      3 FRs and 2 NFRs.'
- id: calculator-desktop-go
  title: Calculator app (Go, one .exe)
  description: A calculator in a single file you double-click; opens in its own browser tab. Built as a Windows .exe.
  idea: 'A calculator app in a single file: double-click it and a calculator opens, with a display, the digit buttons,
    plus, minus, multiply and divide buttons, a clear button and an equals button. Dividing by zero shows "Error"
    instead of crashing.'
  decisions:
    scale: small
    project_type: desktop
    stack: Go 1.24, standard library; the interface is a small web page built into the program
    delivery: binary
    platforms: windows
    constraints: 'Use the Go standard library only. The HTML/CSS/JS is embedded in the program (embed package), so no
      other file is needed next to it. The program starts a tiny local web server that only this computer can reach and
      opens the page in the default browser; if that fails it prints the address. Put the calculation and the HTTP
      handler in an importable package under internal/; main.go only starts the server. Test the handler with
      net/http/httptest. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: timer-desktop-python
  title: Focus timer (Python, desktop window)
  description: A small Pomodoro-style timer window with start, pause and reset; starts with a double click on run.bat.
  idea: 'A small focus timer desktop app: a window shows a 25-minute countdown with start, pause and reset buttons. When
    the time is up the window says so and plays a short sound. The length can be changed between 1 and 60 minutes.'
  decisions:
    scale: small
    project_type: desktop
    stack: Python 3.12, tkinter, pytest
    delivery: script
    constraints: 'Use tkinter and the standard library only. Keep the timer logic (remaining time, start, pause, reset,
      length limits) in a module that does not import tkinter and takes the current time as an argument, so tests need no
      waiting; the window code only draws and calls it, and creates the window inside a function (never at import time),
      because the tests run without a display. Fewest files: timer.py (logic), app.py (window), run.bat, run.sh. Keep
      every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: calculator-cli
  title: Calculator (Python, CLI)
  description: A command-line calculator for the four basic operations; run.sh/run.bat launchers, short documents.
  idea: 'A command-line calculator that performs the four basic operations: addition, subtraction, multiplication
    and division. Usage: calc 6 / 3 prints 2. Division by zero prints a clear error message and exits with a non-zero
    code.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, argparse, pytest
    delivery: script
    constraints: 'Use no external dependencies; standard library only. Fewest files: one source module and a single
      test file under tests/. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: password-generator-go
  title: Password generator (Go, CLI)
  description: Prints random passwords; ready-to-run executables for Windows (.exe), Linux and macOS.
  idea: 'A command-line password generator. "genpass" prints one random password of 16 characters. "--length 24" sets the
    length, "--no-symbols" leaves out symbols and "--count 5" prints five passwords. Every password contains at least
    one lowercase letter, one uppercase letter and one digit. A length below 8 prints a clear error message and exits
    with a non-zero code.'
  decisions:
    scale: small
    project_type: cli
    stack: Go 1.24, standard library, go test
    delivery: binary
    platforms: all
    constraints: 'Use the Go standard library only; draw the random numbers from crypto/rand, not math/rand. Fewest files:
      main.go and one package under internal/ with the generator. Keep every SDLC document short (at most half a page
      each); write at most 3 FRs and 2 NFRs.'
- id: todo-web-node
  title: To-do list (Node.js, web app)
  description: 'A simple to-do list web page: add tasks, tick them off and delete them; runs in Docker.'
  idea: 'A simple to-do list web app. You can add a task, mark it as done or not done, and delete it. The list is
    saved, so it is still there after a restart.'
  decisions:
    scale: small
    project_type: fullstack
    stack: Node.js (Express), pnpm, plain HTML/CSS/JS interface
    database: sqlite
    cache: none
    observability: none
    delivery: docker
    constraints: 'Do not use a framework in the frontend, write plain HTML/CSS/JS. Prefer a SQLite solution that needs
      no native compilation. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: task-api
  title: Task API (Python, web API)
  description: A small REST API to create, list, update and delete tasks; runs in Docker.
  idea: 'A small task tracking API. A task has a title and a status (todo or done). The API can create a task, list
    the tasks (optionally only those with a given status), update a task and delete a task.'
  decisions:
    scale: small
    project_type: backend
    stack: Python 3.12, FastAPI, pytest
    database: sqlite
    cache: none
    observability: none
    ui: none
    delivery: docker
    constraints: 'Include input validation and meaningful error codes (400, 404). Keep every SDLC document short (at most
      half a page each); write at most 3 FRs and 2 NFRs.'
- id: backup-helper-script
  title: Folder backup (sh + bat scripts)
  description: Helper scripts that copy a folder into a timestamped backup; backup.sh for Linux/macOS and backup.bat for Windows.
  idea: 'Helper scripts that back up a folder: "backup <source> <backup-folder>" copies the source folder into
    <backup-folder>/<source-name>-YYYYMMDD-HHMMSS and prints where the backup went. A missing source folder prints a
    clear error message and exits with a non-zero code. The same behaviour for Linux/macOS (backup.sh) and for Windows
    (backup.bat).'
  decisions:
    scale: small
    project_type: cli
    stack: POSIX sh and Windows batch (.bat), no dependencies
    delivery: script
    constraints: 'Only the standard tools of each system (cp, date / xcopy). The tests run in a Linux container: write a
      shell test script under tests/ that exercises backup.sh with temporary folders and run it with
      [sh, tests/test_backup.sh] as unit_test; backup.bat cannot run there, so describe in the README how to check it by
      hand. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: file-organizer-script
  title: Folder organizer (sh + bat scripts)
  description: Helper scripts that sort the files of a folder into subfolders by type; organize.sh for Linux/macOS and organize.bat for Windows.
  idea: 'Helper scripts that tidy a folder: "organize <folder> [--dry-run]" moves every file into a subfolder named after
    its type (images, documents or other), chosen from the file extension; --dry-run only prints what would be moved. A
    file is skipped, never overwritten, when the target already has a file with that name. A missing folder prints a
    clear error message and exits with a non-zero code. The same behaviour for Linux/macOS (organize.sh) and for Windows
    (organize.bat).'
  decisions:
    scale: small
    project_type: cli
    stack: POSIX sh and Windows batch (.bat), no dependencies
    delivery: script
    constraints: 'Only the standard tools of each system. The tests run in a Linux container: write a shell test script
      under tests/ that exercises organize.sh with temporary folders and run it with [sh, tests/test_organize.sh] as
      unit_test; organize.bat cannot run there, so describe in the README how to check it by hand. Keep every SDLC
      document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
