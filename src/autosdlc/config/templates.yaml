# Example project templates shown in the UI. Each one fills the form; the user can change it afterwards.
# The decisions keys are the same as in questions.yaml. Idea at most 1000, stack at most 200 characters.
# The first template is deliberately tiny: to see the concept end to end in a few minutes.
# Texts are English source strings; other languages are in locales/<code>/content.yaml.
- id: quick-demo
  title: ⚡ Quick demo — temperature converter (Python, library)
  description: The smallest example to see the concept in a few minutes; two functions, one test file, short documents.
  idea: 'A small Python library that converts between Celsius and Fahrenheit: celsius_to_fahrenheit and fahrenheit_to_celsius
    functions. Raise a ValueError for values below absolute zero (-273.15 °C).'
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    constraints: 'Use no external dependencies; no setup command is needed. Fewest files: one source module, a single
      test file under tests/, project.yaml and a Dockerfile. Keep every SDLC document short (at most half a page
      each); write at most 3 FRs and 2 NFRs.'
- id: calculator-cli
  title: Calculator (Python, CLI)
  description: A command-line calculator for the four basic operations; one module, one test file, short documents.
  idea: 'A command-line calculator that performs the four basic operations: addition, subtraction, multiplication
    and division. Usage: calc 6 / 3 prints 2. Division by zero prints a clear error message and exits with a non-zero
    code.'
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, argparse, pytest
    constraints: 'Use no external dependencies; standard library only. Fewest files: one source module, a single
      test file under tests/, project.yaml and a Dockerfile. Keep every SDLC document short (at most half a page
      each); write at most 3 FRs and 2 NFRs.'
- id: calculator-cli-go
  title: Calculator (Go, CLI)
  description: A lightweight command-line calculator for the four basic operations; no dependencies, builds and tests in seconds.
  idea: 'A command-line calculator that performs the four basic operations: addition, subtraction, multiplication
    and division. Usage: calc 6 / 3 prints 2. Division by zero prints a clear error message and exits with a non-zero
    code.'
  decisions:
    scale: small
    project_type: cli
    stack: Go 1.24, standard library, go test
    constraints: 'Use the Go standard library only (no go get); go.mod declares no dependencies and no setup command
      is needed. Fewest files: main.go, calc.go with the pure calculation functions, calc_test.go, project.yaml and
      a Dockerfile. Keep every SDLC document short (at most half a page each); write at most 3 FRs and 2 NFRs.'
- id: inventory-tracker
  title: Inventory tracker (Node.js, fullstack)
  description: A simple web application that keeps stock records with product name, category and location.
  idea: A simple inventory tracking application. Products are stored with product name, category and location (warehouse/shelf).
    It supports adding, editing, deleting and listing products; the list can be searched by product name and filtered
    by category and location.
  decisions:
    project_type: fullstack
    stack: Node.js (Express), pnpm, plain HTML/CSS/JS interface
    database: sqlite
    cache: none
    observability: none
    constraints: Do not use a framework in the frontend, write plain HTML/CSS/JS. The user interface texts should
      be in Turkish. Prefer a SQLite solution that needs no native compilation.
- id: task-api
  title: Task tracking API (Python, backend)
  description: A REST API with endpoints to create, list, complete and delete tasks.
  idea: A task tracking API for small teams. Tasks have a title, description, due date and status (todo, in progress,
    done). It has endpoints to create, list, filter by status, update and delete tasks.
  decisions:
    project_type: backend
    stack: Python 3.12, FastAPI, pytest
    database: sqlite
    cache: none
    observability: none
    ui: none
    constraints: Include input validation and meaningful error codes (400, 404).
- id: unit-converter-cli
  title: Unit converter (Python, CLI)
  description: A small CLI tool that converts length, weight and temperature units.
  idea: A CLI tool that converts length, weight and temperature units. For example the command "convert 10 km mi"
    converts 10 kilometers to miles. It has a command that lists the supported units and a clear error message for
    an invalid unit.
  decisions:
    scale: small
    project_type: cli
    stack: Python 3.12, argparse, pytest
    constraints: Use no external dependencies; standard library only.
- id: text-helpers
  title: Text helpers (Python, library)
  description: A library offering slug generation and text cleanup functions that handle Turkish characters correctly.
  idea: 'A text helpers library that handles Turkish characters correctly: slug generation for URLs, collapsing
    extra whitespace, word counting and smart truncation to a given length. Every function should be documented
    and type-hinted.'
  decisions:
    scale: small
    project_type: library
    stack: Python 3.12, pytest
    constraints: Use no external dependencies; standard library only.
