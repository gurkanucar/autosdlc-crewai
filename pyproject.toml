[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosdlc"
version = "0.1.0"
description = "A CrewAI SDLC workflow with API and browser tests"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "pytest>=8,<10",
  "pytest-playwright>=0.7,<1",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]

[project.scripts]
autosdlc = "autosdlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autosdlc = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

